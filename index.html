<h1>特定行政書士 考査対策　模擬問題 第1回（非公式）</h1>
<p class="lead">個人が作成した非公式の模擬問題です。日本行政書士会連合会その他の団体とは関係がありません。法令は2026年10月時点のものによっています。誤りを含む可能性がありますので、必ず条文で確かめてください。内容についての個別の質問には対応していません。</p>
<p class="lead" id="lead">30問・120分。「開始」を押してから解きます。各肢の右で○×を付け、左の番号を押して解答を選びます（○×は解答に反映されません。文は押しても何も起きません）。未解答か「あとで見直す」が残っているあいだは採点できません。</p>

<script>
(function(){
var TITLE='模擬問題 第1回の解答',KEY='moshi_1_public_v1';
var Q=[{"n":1,"s":"行政手続法における申請と届出に関する次の記述のうち、正しいものはどれか。","c":["行政庁に対し一定の事項の通知をする行為であって、自己の期待する一定の法律上の効果を発生させるためには当該通知をすべきこととされているものは、法令により直接に当該通知が義務付けられているものではないから、届出には該当しない。","法令に基づき行政庁の許認可等を求める行為であっても、当該行為に対して行政庁が諾否の応答をすべきこととされていないものは、申請には該当しない。","届出が法令に定められた届出の形式上の要件に適合している場合には、当該届出が法令により提出先とされている機関の事務所に到達し、かつ、当該機関がこれを受理したときに、当該届出をすべき手続上の義務が履行されたものとされる。","行政庁は、法令に定められた届出の形式上の要件に適合しない届出については、速やかに、届出をした者に対し相当の期間を定めて当該届出の補正を求めなければならない旨が、行政手続法に定められている。"]},{"n":2,"s":"行政手続法における地方公共団体の機関に関する同法の規定の適用関係に関する次の記述のうち、正しいものはどれか。","c":["地方公共団体の機関がする処分については、その根拠となる規定が法律に置かれているものであっても、行政手続法第2章および第3章の規定は適用されない。","地方公共団体の機関がする行政指導については、その根拠となる規定が法律に置かれているものに限り、行政手続法第4章の規定が適用される。","地方公共団体の機関に対する届出であっても、その通知の根拠となる規定が法律に置かれているものについては、行政手続法第3条第3項によって同法第5章の規定の適用が除外されることはない。","地方公共団体の機関が命令等を定める行為については、当該命令等が法律の委任に基づくものである場合に限り、行政手続法第6章の規定が適用される。"]},{"n":3,"s":"行政手続法における審査基準と処分基準に関する次の記述のうち、正しいものはどれか。","c":["行政庁は、処分基準を定めた場合であっても、これを公にしておくことまでは義務付けられておらず、公にしておくよう努めれば足りる。","審査基準とは、不利益処分をするかどうか、またはどのような不利益処分とするかについて、その法令の定めに従って判断するために必要とされる基準をいう。","行政庁は、審査基準を定めるに当たっては、許認可等の性質に照らしてできる限り具体的なものとしなければならないが、処分基準については、これを具体的なものとすべき旨の定めは置かれていない。","行政庁は、行政上特別の支障があるときであっても、審査基準を、法令により申請の提出先とされている機関の事務所における備付けその他の適当な方法により公にしておかなければならない。"]},{"n":4,"s":"行政手続法における処分の理由の提示に関する次の記述のうち、誤っているものはどれか。","c":["行政庁は、申請により求められた許認可等を拒否する処分をする場合において、法令に定められた許認可等の要件が数量的指標その他の客観的指標により明確に定められており、当該申請がこれに適合しないことが申請書の記載から明らかであるときは、申請者の求めがあったときに理由を示せば足りる。","行政庁は、不利益処分をする場合において、理由を示さないで処分をすべき差し迫った必要があるときは、処分と同時に理由を示すことを要しないが、処分後において理由を示すことが困難な事情があるときを除き、処分後相当の期間内に理由を示さなければならない。","行政手続法は、申請により求められた許認可等を拒否する処分についても、不利益処分についても、処分と同時に理由を示すことを原則としている。","不利益処分を書面でするときは、その理由は書面により示さなければならないが、申請により求められた許認可等を拒否する処分については、処分を書面でするときであっても、理由を口頭で示すことが認められている。"]},{"n":5,"s":"行政手続法における不利益処分等をしようとする場合の意見陳述のための手続に関する次の記述のうち、正しいものはどれか。","c":["行政庁は、名あて人の資格または地位を直接にはく奪する不利益処分をしようとするときは、当該不利益処分の名あて人となるべき者について、弁明の機会の付与の手続を執らなければならない。","行政庁は、許認可等の効力を一定期間停止する不利益処分をしようとするときは、弁明の機会の付与の手続を執らなければならず、行政庁が相当と認めるときであっても、聴聞の手続を執ることはできない。","行政庁は、金銭の給付決定を取り消す不利益処分をしようとするときは、当該不利益処分の名あて人となるべき者について、聴聞の手続も弁明の機会の付与の手続も執ることを要しない。","行政庁は、申請により求められた許認可等を拒否する処分をしようとするときは、申請者について、弁明の機会の付与の手続を執らなければならない。"]},{"n":6,"s":"行政手続法における聴聞に関する次の記述のうち、正しいものはいくつあるか。","c":["一つ","二つ","三つ","四つ"],"k":["聴聞の主宰者は、必要があると認めるときは、当事者以外の者であって当該不利益処分の根拠となる法令に照らし当該不利益処分につき利害関係を有するものと認められる者に対し、当該聴聞に関する手続に参加することを求めることができる。","当事者から、聴聞の通知があった時から聴聞が終結する時までの間に、当該不利益処分の原因となる事実を証する資料の閲覧を求められた行政庁は、第三者の利益を害するおそれがあるときその他正当な理由があるときでなければ、その閲覧を拒むことができない。","当事者は、聴聞の期日に出頭して、意見を述べ、証拠書類等を提出することができるほか、主宰者の許可を得て行政庁の職員に対し質問を発することができる。","行政庁は、不利益処分の決定をするときは、聴聞調書の内容および報告書に記載された主宰者の意見を十分に参酌してこれをしなければならない。"]},{"n":7,"s":"行政手続法における行政指導および処分等の求めに関する次の記述のうち、誤っているものはどれか。","c":["行政指導に携わる者は、当該行政指導をする際に、行政機関が許認可等をする権限を行使し得る旨を示すときは、その相手方に対して、当該権限を行使し得る根拠となる法令の条項、当該条項に規定する要件および当該権限の行使がその要件に適合する理由を示さなければならない。","法令に違反する行為の是正を求める行政指導の相手方は、当該行政指導の根拠となる規定が法律に置かれているか否かにかかわらず、当該行政指導が法令に規定する要件に適合しないと思料するときは、当該行政指導をした行政機関に対し、その旨を申し出て、当該行政指導の中止その他必要な措置をとることを求めることができる。","同一の行政目的を実現するため一定の条件に該当する複数の者に対し行政指導をしようとするときは、行政機関は、あらかじめ、事案に応じ、行政指導指針を定め、かつ、行政上特別の支障がない限り、これを公表しなければならない。","何人も、法令に違反する事実がある場合において、その是正のためにされるべき処分がされていないと思料するときは、当該処分をする権限を有する行政庁に対し、その旨を申し出て、当該処分をすることを求めることができる。"]},{"n":8,"s":"行政手続法における意見公募手続に関する次の記述のうち、正しいものはどれか。","c":["命令等制定機関は、30日以上の意見提出期間を定めることができないやむを得ない理由があるときは、30日を下回る意見提出期間を定めることができるが、この場合には、当該命令等の案の公示の際その理由を明らかにしなければならない。","意見公募手続を実施して命令等を定めた命令等制定機関が、当該命令等の公布と同時期に公示しなければならないのは、命令等の題名、命令等の案の公示の日および提出意見であり、提出意見を考慮した結果およびその理由は、公示すべき事項に含まれていない。","意見公募手続において意見を提出することができる者は、当該命令等の案について利害関係を有する者に限られる。","命令等制定機関は、意見提出期間内に提出された意見を十分に考慮しなければならず、同じ趣旨の意見が多数提出されたときは、その意見に従って命令等を定めなければならない。"]},{"n":9,"s":"次の文章は、行政不服審査法の適用除外に関する最高裁判所第一小法廷令和2年3月26日判決の趣旨を説明したものである。空欄アからエに入る語句の組合せのうち、正しいものはどれか。","c":["ア　相手方　　　イ　地方公共団体　　ウ　処分の根拠　　エ　当たらない","ア　名あて人　　イ　一般私人　　　　ウ　審査の対象　　エ　当たらない","ア　相手方　　　イ　一般私人　　　　ウ　審査の対象　　エ　当たる","ア　相手方　　　イ　一般私人　　　　ウ　審査の対象　　エ　当たらない"],"p":["行政不服審査法第7条第2項は、国の機関または地方公共団体その他の公共団体もしくはその機関に対する処分で、これらの機関または団体がその固有の資格において当該処分の　ア　となるものおよびその不作為については、同法の規定は適用しないと定めている。","この判決によれば、「固有の資格」とは、国の機関等であるからこそ立ち得る特有の立場、すなわち、　イ　が立ち得ないような立場をいう。そして、国の機関等が　イ　が立ち得ないような立場において　ア　となる処分であるか否かを検討するに当たっては、当該処分に係る規律のうち、当該処分に対する不服申立てにおいて　ウ　となるべきものに着目すべきであるとされる。","この判決は、公有水面埋立法に基づく埋立ての承認について、国の機関が固有の資格において　ア　となるものに　エ　と判断した。"]},{"n":10,"s":"行政不服審査法における審査請求をすべき行政庁に関する次の記述のうち、正しいものはどれか。","c":["処分庁に上級行政庁がある場合には、法律に特別の定めがある場合を除き、常に、当該処分庁の直近の上級行政庁に対して審査請求をする。","法令に基づく申請に対する不作為についての審査請求も、処分についての審査請求と同じく、不作為庁に上級行政庁がない場合には、法律（条例に基づく処分については、条例）に特別の定めがある場合を除き、当該不作為庁に対してする。","処分庁の上級行政庁として、国家行政組織法第3条第2項に規定する庁の長と、その上級行政庁である主任の大臣とがある場合には、法律に特別の定めがある場合を除き、当該主任の大臣に対して審査請求をする。","主任の大臣が処分庁である場合には、法律に特別の定めがある場合を除き、内閣総理大臣に対して審査請求をする。"]},{"n":11,"s":"行政不服審査法における再調査の請求および再審査請求に関する次の記述のうち、誤っているものはどれか。","c":["再調査の請求をした者は、原則として、当該再調査の請求についての決定を経た後でなければ審査請求をすることができないが、再調査の請求をした日の翌日から起算して3月を経過しても処分庁が決定をしない場合には、決定を経ないで審査請求をすることができる。","処分について行政不服審査法第2条の規定により審査請求をした者は、当該処分について再調査の請求をすることができない。","処分について再調査の請求をした者が、当該再調査の請求についての決定を経た後に審査請求をする場合、その審査請求は、正当な理由があるときを除き、当該決定があったことを知った日の翌日から起算して3月を経過するまですることができる。","再審査請求は、原裁決を対象としてすることも、当該処分を対象としてすることもでき、再審査請求をすることができる旨を定める法律に定める行政庁に対してする。"]},{"n":12,"s":"行政不服審査法における不作為についての審査請求に関する次の記述のうち、正しいものはどれか。","c":["不作為についての審査請求が理由がある場合には、審査庁は、裁決で、当該不作為が違法または不当である旨を宣言する。この場合において、不作為庁の上級行政庁である審査庁は、当該申請に対して一定の処分をすべきものと認めるときは、当該不作為庁に対し、当該処分をすべき旨を命ずる。","不作為についての審査請求は、当該不作為に係る処分につき利害関係を有する者であれば、法令に基づき当該処分についての申請をした者でなくても、することができる。","不作為についての審査請求書には、審査請求人の氏名または名称および住所または居所ならびに審査請求の年月日を記載すれば足り、当該不作為に係る処分についての申請の内容および年月日を記載することは要しない。","不作為についての審査請求において、不作為庁が提出する弁明書には、処分をしていない理由を記載すれば足り、予定される処分の時期、内容および理由を記載することは要しない。"]},{"n":13,"s":"行政不服審査法における審査請求の手続に関する次の記述のうち、正しいものはいくつあるか。","c":["一つ","二つ","三つ","四つ"],"k":["審査請求人の代理人は、審査請求の取下げについて特別の委任を受けていなくても、審査請求人のために、反論書の提出その他当該審査請求に関する行為（審査請求の取下げを除く。）をすることができる。","審査請求書が行政不服審査法第19条の規定に違反する場合において、その不備が補正することのできるものであっても、審査庁は、補正を命ずることなく、直ちに当該審査請求を却下することができる。","他の法律に口頭で審査請求をすることができる旨の定めがある処分について、口頭で審査請求をした者は、その取下げも口頭ですることができる。","処分についての審査請求（当該処分について再調査の請求をしていない場合）は、正当な理由があるときを除き、処分があったことを知った日の翌日から起算して3月を経過したときはすることができず、また、処分があった日の翌日から起算して1年を経過したときもすることができない。"]},{"n":14,"s":"行政不服審査法における審理手続に関する次の記述のうち、誤っているものはどれか。","c":["審理員は、審査庁から指名されたときは、処分庁等が審査庁である場合を除き、直ちに、審査請求書または審査請求録取書の写しを処分庁等に送付しなければならない。","審査請求人は、送付された弁明書に記載された事項に対する反論を記載した書面を提出することができ、審理員が反論書を提出すべき相当の期間を定めたときは、その期間内にこれを提出しなければならない。","審理員は、必要な審理を終えたと認めるときは、審理手続を終結するものとされ、審理手続を終結したときは、遅滞なく、審理員意見書を作成し、これを作成したときは、速やかに、事件記録とともに審査庁に提出しなければならない。","口頭意見陳述は、審理員が期日および場所を指定して行うが、招集するのは申立てをした者および処分庁等で足り、その他の審理関係人を招集することは要しない。"]},{"n":15,"s":"行政不服審査法における審査請求の裁決に関する次の記述のうち、正しいものはどれか。","c":["処分（事実上の行為を除く。）についての審査請求が理由がある場合、処分庁の上級行政庁でも処分庁でもない審査庁は、裁決で、当該処分の全部または一部を取り消すことはできるが、当該処分を変更することはできない。","裁決は、主文および理由を記載した裁決書によりしなければならないが、事案の概要および審理関係人の主張の要旨を裁決書に記載することは要しない。","事実上の行為についての審査請求が理由がある場合、処分庁以外の審査庁は、裁決で、当該事実上の行為が違法または不当である旨を宣言するとともに、自ら当該事実上の行為の全部または一部を撤廃する。","審査庁は、審理員意見書の内容に拘束され、裁決の主文を審理員意見書と異なる内容とすることはできない。"]},{"n":16,"s":"行政不服審査法における教示に関する次の記述のうち、誤っているものはどれか。","c":["審査請求をすることができる処分を書面でする行政庁は、その処分の相手方に対し、審査請求ができること、審査請求の提出先となる行政庁および審査請求ができる期間の三つを、書面で教示する義務を負う。","行政庁が行政不服審査法第82条の規定による教示をしなかった場合には、当該処分について不服がある者は、当該処分庁に不服申立書を提出することができ、当該処分が処分庁以外の行政庁に対し審査請求をすることができる処分であるときは、処分庁は、速やかに、当該不服申立書を当該行政庁に送付しなければならない。","利害関係人から、当該処分が不服申立てをすることができる処分であるかどうかについて教示を求められた行政庁は、教示を求めた者が書面による教示を求めたときであっても、口頭で教示すれば足りる。","処分庁が誤って審査請求をすべき行政庁でない行政庁を審査請求をすべき行政庁として教示した場合において、その教示された行政庁に書面で審査請求がされたときは、当該行政庁は、速やかに、審査請求書を処分庁または審査庁となるべき行政庁に送付し、かつ、その旨を審査請求人に通知しなければならない。"]},{"n":17,"s":"行政事件訴訟法における行政事件訴訟の諸類型に関する次の記述のうち、正しいものはどれか。","c":["機関訴訟とは、国または公共団体の機関の法規に適合しない行為の是正を求める訴訟で、選挙人たる資格その他自己の法律上の利益にかかわらない資格で提起するものをいう。","無効等確認の訴えは、処分もしくは裁決の存否またはその効力の有無の確認を求める訴訟であり、抗告訴訟に当たる。","民衆訴訟および機関訴訟は、法律に定める場合でなくても、自己の法律上の利益を侵害された者であれば、提起することができる。","公法上の法律関係に関する確認の訴えは、行政事件訴訟法上、抗告訴訟の一類型として定められている。"]},{"n":18,"s":"次の文章は、処分について不服申立てをする「法律上の利益」が争点となった最高裁判所第三小法廷昭和53年3月14日判決（いわゆる主婦連ジュース事件）の一部である。空欄アからエに入る語句の組合せのうち、正しいものはどれか。","c":["ア　法律上の利益　　イ　権利　　ウ　法律上保護された利益　　　エ　必然的に","ア　法律上の利益　　イ　権利　　ウ　法律上保護に値する利益　　エ　必然的に","ア　法律上の利益　　イ　財産　　ウ　法律上保護された利益　　　エ　事実上","ア　事実上の利益　　イ　権利　　ウ　法律上保護された利益　　　エ　必然的に"],"p":["「（不服がある者とは、）一般の行政処分についての不服申立の場合と同様に、当該処分について不服申立をする　ア　がある者、すなわち、当該処分により自己の　イ　若しくは　ウ　を侵害され又は　エ　侵害されるおそれのある者をいう」"]},{"n":19,"s":"行政事件訴訟法における取消訴訟の訴訟要件に関する次の記述のうち、誤っているものはどれか。","c":["処分の取消しの訴えは、当該処分につき法令の規定により審査請求をすることができる場合においても、法律に当該処分についての審査請求に対する裁決を経た後でなければ処分の取消しの訴えを提起することができない旨の定めがあるときを除き、直ちに提起することができる。","処分をした行政庁が国または公共団体に所属しない場合には、取消訴訟は、当該行政庁を被告として提起しなければならない。","土地の収用その他不動産に係る処分についての取消訴訟は、被告の普通裁判籍の所在地を管轄する裁判所および処分をした行政庁の所在地を管轄する裁判所のほか、その不動産の所在地の裁判所にも提起することができる。","取消訴訟は、処分があったことを知った日から6箇月を経過した後であっても、処分の日から1年を経過していなければ、正当な理由の有無を問わず、提起することができる。"]},{"n":20,"s":"行政事件訴訟法における取消訴訟の審理と判決に関する次の記述のうち、正しいものはどれか。","c":["裁判所は、必要があると認めるときは、職権で、証拠調べをすることができ、その証拠調べの結果について当事者の意見をきくことを要しない。","処分を取り消す判決は、当該訴訟の当事者に対してのみ効力を有し、第三者に対しては効力を有しない。","取消訴訟においては、原告は、自己の法律上の利益に関係のない違法を理由として処分の取消しを求めることができない。","裁判所は、処分が違法ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合において、一切の事情を考慮したうえ、処分を取り消すことが公共の福祉に適合しないと認めて請求を棄却するときは、判決の主文において処分が違法であることを宣言することを要しない。"]},{"n":21,"s":"民事訴訟における相手方の主張した事実に対する認否に関する次の記述のうち、正しいものはどれか。","c":["相手方の主張した事実を知らない旨の陳述をした者は、その事実を自白したものと推定される。","当事者が口頭弁論において相手方の主張した事実を争うことを明らかにしない場合には、弁論の全趣旨によりその事実を争ったものと認めるべきときを除き、その事実を自白したものとみなされる。","当事者が自白した事実は証明することを要しないが、顕著な事実については、相手方がこれを争う場合には、証明することを要する。","相手方の主張する主要事実を否認した当事者は、その事実が存在しないことについて証明責任を負う。"]},{"n":22,"s":"Ｘは、Ｙに対し、2026年5月30日に50万円を、返還時期を同年6月30日と定めて貸し付けたと主張して、消費貸借契約に基づき50万円の返還を求める訴えを提起した（書面によらない消費貸借とする。）。この訴訟における主張立証に関する次の記述のうち、誤っているものはどれか。","c":["Ｘは、請求原因として、Ｙとの間で50万円の返還の合意をしたことおよびＹに50万円を交付したことを主張立証しなければならない。","Ｘは、請求原因として、返還時期の合意およびその返還時期が到来したことも主張しなければならない。","Ｙの「50万円は借りたが、同年6月15日に全額を返済した」との主張は、抗弁であり、Ｙがその事実について主張立証責任を負う。","Ｙの「50万円は受け取ったが、それはＸの仕事を手伝った謝礼として受け取ったものである」との主張は、請求原因事実と両立する事実の主張であるから、抗弁である。"]},{"n":23,"s":"Ｘは、Ｙに対し、2026年4月10日に中古自動車甲を代金80万円で売ったと主張して、売買契約に基づき代金80万円の支払を求める訴えを提起した。この訴訟における主張立証に関する次の記述のうち、正しいものはどれか。","c":["Ｙの「甲は無事故車であると信じて買ったが、実際には事故車であった。無事故車であることを前提に買うことはＸに表示していた。よって売買契約を取り消す」との主張は、請求原因事実と両立する事実の主張であり、抗弁である。","Ｙの「甲の引渡しを受けるまでは代金を支払わない」との主張は、代金支払請求権を消滅させる抗弁である。","Ｙの「代金80万円は契約の日に現金で支払った」との主張は、請求原因事実と両立しない事実の主張であるから、否認である。","Ｘは、請求原因として、売買契約の締結のほかに、代金の支払時期の合意およびその到来を主張立証しなければならない。"]},{"n":24,"s":"Ｘは、甲土地を所有していると主張して、甲土地を占有するＹに対し、所有権に基づき甲土地の明渡しを求める訴えを提起した。この訴訟における主張立証に関する次の記述のうち、正しいものはどれか。","c":["Ｘが、甲土地についてＸ名義の所有権移転登記があることを証明した場合には、登記の効力によってＸが所有者であることが法律上推定されるから、Ｙが、Ｘが所有者でないことについて証明責任を負う。","Ｙの「甲土地はＸから賃借しており、その引渡しを受けて占有している」との主張は、Ｘの請求原因事実と両立しない事実の主張であるから、否認である。","Ｙが、Ｘが現在甲土地を所有していることを認めた場合には、Ｘは、甲土地の所有権を取得した原因となる事実を主張立証する必要がない。","Ｙが甲土地を占有していることを認めている場合であっても、Ｘは、Ｙの占有の開始時期および態様を具体的に主張立証しなければならない。"]},{"n":25,"s":"処分の取消しの訴えにおける主張立証に関する次の記述のうち、誤っているものはどれか。","c":["処分の取消しの訴えは形成訴訟であり、その訴訟物は、行政処分の違法一般であると解されている。","処分の名あて人以外の第三者が処分の取消しの訴えを提起する場合には、原告は、処分の違法事由のほかに、自己に原告適格があることを主張立証しなければならない。","不利益処分の取消しの訴えにおいては、名あて人について当該処分の要件に該当する事実があることは、一般に、行政庁の側が主張立証すべきものと解されている。","裁量処分の取消しの訴えにおいては、裁量権の範囲の逸脱またはその濫用がなかったことについて、行政庁の側が証明責任を負い、原告は、逸脱または濫用に当たる事情を主張立証する必要がない。"]},{"n":26,"s":"民事訴訟における文書の証拠力に関する次の記述のうち、正しいものはいくつあるか。","c":["一つ","二つ","三つ","四つ"],"k":["文書の形式的証拠力とは、文書の記載内容が事実認定に影響する力をいい、実質的証拠力とは、文書が作成名義人の意思に基づいて作成されたこと（文書の成立の真正）をいう。","私文書は、本人またはその代理人の署名または押印があるときは、真正に成立したものと推定される。","文書上の印影が本人の印章によるものであることから文書の成立の真正が推定される場合には、その文書に記載された内容が真実であることも推定される。","領収書は、意思表示その他の法律行為が記載されている文書であるから、処分文書に当たる。"]},{"n":27,"s":"民事訴訟における裁判上の自白および訴訟手続の終了に関する次の記述のうち、正しいものはどれか。","c":["請求の認諾がされても、訴訟は終了せず、裁判所は、請求の当否について判決をしなければならない。","訴えの取下げは、相手方が本案について準備書面を提出し、弁論準備手続において申述をし、または口頭弁論をした後にあっては、相手方の同意を得なければ、その効力を生じない。","裁判上の自白が成立した主要事実については、証明することを要しないが、裁判所は、証拠調べの結果これと異なる心証を得たときは、自白と異なる事実を認定することができる。","請求の放棄がされた場合には、訴えの取下げがされた場合と同じく、訴訟は初めから係属していなかったものとみなされる。"]},{"n":28,"s":"特定行政書士の規律に関する次の記述のうち、行政書士職務基本規則に照らし、正しいものはいくつあるか。","c":["一つ","二つ","三つ","四つ"],"k":["特定行政書士は、審査請求手続等を行うにあたり、依頼者の利益と他の依頼者の利益が相反する事件を受任してはならない。","特定行政書士は、職務の公正を保ち得ない事由の発生するおそれがある場合には、あらかじめ依頼者に対し、その事情を説明し、職務を行うことができないことについて、同意を得なければならない。","特定行政書士は、事件の受任に際して、依頼者の相手方と特別の関係があるために、依頼者との信頼関係に影響を及ぼすおそれがあるときは、依頼者に対しその事情を告げなければならない。","特定行政書士は、審査請求手続等を受任した場合には、依頼者の権利が速やかに実現されるように努める。"]},{"n":29,"s":"令和8年1月1日に施行された改正後の行政書士法に関する次の記述のうち、正しいものはいくつあるか。","c":["一つ","二つ","三つ","四つ"],"k":["行政書士は、その業務を通じて、行政に関する手続の円滑な実施に寄与するとともに国民の利便に資し、もって国民の権利利益の実現に資することを使命とする。","特定行政書士が代理することができる行政庁に対する不服申立ての手続は、行政書士が現に作成した官公署に提出する書類に係る許認可等に関するものに限られ、申請者本人が作成した書類に係る許認可等に関するものは含まれない。","行政書士または行政書士法人でない者は、他の法律に別段の定めがある場合などを除き、他人の依頼を受け、いかなる名目によるかを問わず報酬を得て、業として行政書士法第1条の3に規定する業務を行うことができない。","法人の従業者が、その法人の業務に関し、行政書士または行政書士法人でない者による業務の制限の規定（行政書士法第19条第1項）に違反する行為をしたときは、行為者が罰せられるが、その法人に対して罰金刑が科されることはない。"]},{"n":30,"s":"行政書士の職務上の倫理に関する次の記述のうち、行政書士法および行政書士職務基本規則に照らし、正しいものはいくつあるか。","c":["一つ","二つ","三つ","四つ"],"k":["行政書士は、正当な理由がなく、その業務上取り扱った事項について知り得た秘密を漏らしてはならず、行政書士でなくなった後も同様である。","行政書士は、職務上請求書を、その職務上必要な請求に限り使用することができ、身元調査等、人権侵害のおそれがある使用をしてはならない。","行政書士は、事件が終了したときにその経過および結果を依頼者に報告すれば足り、事件を受任している間に、事件の経過および重要な事項を依頼者に報告することまでは求められていない。","行政書士は、依頼者や他の行政書士だけでなく、日本行政書士会連合会および所属する行政書士会を誹謗中傷する等、信義に反する行為をしてはならない。"]}];

var EXP={"1":{"items":[{"label":"肢1","verdict":"×","purpose":"届出の定義は、届出についての決まり（37条）がどの行為に及ぶかを決めるためにある。法令が通知を義務付けている行為が届出である。","law":"行政手続法2条7号「届出　行政庁に対し一定の事項の通知をする行為（申請に該当するものを除く。）であって、法令により直接に当該通知が義務付けられているもの（自己の期待する一定の法律上の効果を発生させるためには当該通知をすべきこととされているものを含む。）をいう。」","reason":"定義のかっこ書きは、自己の期待する法律上の効果を発生させるために通知をすべきこととされているものを「含む」と書いている。肢は「届出には該当しない」としている。条文と逆なので誤りである。"},{"label":"肢2","verdict":"○","purpose":"申請の定義は、第2章の決まり（審査基準、審査と応答の義務、理由の提示など）がどの行為に及ぶかを決めるためにある。行政庁に応答の義務がある行為だけを、申請として守る。","law":"行政手続法2条3号「申請　法令に基づき、行政庁の許可、認可、免許その他の自己に対し何らかの利益を付与する処分（以下「許認可等」という。）を求める行為であって、当該行為に対して行政庁が諾否の応答をすべきこととされているものをいう。」","reason":"「行政庁が諾否の応答をすべきこととされているもの」は、申請の定義の一部である。応答をすべきこととされていない行為は、許認可等を求める行為であっても申請に当たらない。肢は正しい。"},{"label":"肢3","verdict":"×","purpose":"37条は、行政庁が届出を受け取らない、または返すという扱いをして、届出を無かったことにするのを防ぐためにある。形式がととのった届出は、届いた時に義務を果たしたことになる。","law":"行政手続法37条「届出が届出書の記載事項に不備がないこと、届出書に必要な書類が添付されていることその他の法令に定められた届出の形式上の要件に適合している場合は、当該届出が法令により当該届出の提出先とされている機関の事務所に到達したときに、当該届出をすべき手続上の義務が履行されたものとする。」","reason":"条文は「到達したときに」義務が履行されたものとすると定めている。肢は「かつ、当該機関がこれを受理したとき」を足している。受理は条文にないので誤りである。"},{"label":"肢4","verdict":"×","purpose":"7条は、行政庁が申請を受け取ったまま放っておくのを防ぐためにある。形式の不備がある申請には、補正を求めるか、拒否するかのどちらかをしなければならない。この決まりは申請についてのものである。","law":"行政手続法7条「行政庁は、申請がその事務所に到達したときは遅滞なく当該申請の審査を開始しなければならず、かつ、申請書の記載事項に不備がないこと、申請書に必要な書類が添付されていること、申請をすることができる期間内にされたものであることその他の法令に定められた申請の形式上の要件に適合しない申請については、速やかに、申請をした者（以下「申請者」という。）に対し相当の期間を定めて当該申請の補正を求め、又は当該申請により求められた許認可等を拒否しなければならない。」","reason":"補正を求める決まりは、申請についての7条にある。届出についての条文は37条だけで、そこに補正を求める定めはない。肢は、届出について補正を求めなければならない旨が行政手続法に定められているとしているので誤りである。"}],"note":"申請と届出の違い\n定義：申請 許認可等を求める行為。行政庁が諾否の応答をすべきもの（2条3号）／届出 一定の事項を通知する行為。法令が通知を義務付けているもの（2条7号）\n行政庁の応答：申請 ある／届出 ない\n形式の不備があるとき：申請 補正を求めるか、拒否する（7条）／届出 補正を求める定めはない\nいつ手続が進むか：申請 事務所に到達したら遅滞なく審査を始める（7条）／届出 形式がととのって事務所に到達した時に、義務が履行されたものとする（37条）"},"2":{"items":[{"label":"肢1","verdict":"×","purpose":"3条3項は、地方自治に配慮して、地方公共団体の機関がする行為の一部を行政手続法の第2章から第6章までの外に置く条文である。処分については、地方公共団体が自分で定めた条例または規則に根拠があるものだけを外す。","law":"行政手続法3条3項「第一項各号及び前項各号に掲げるもののほか、地方公共団体の機関がする処分（その根拠となる規定が条例又は規則に置かれているものに限る。）及び行政指導、地方公共団体の機関に対する届出（前条第七号の通知の根拠となる規定が条例又は規則に置かれているものに限る。）並びに地方公共団体の機関が命令等を定める行為については、次章から第六章までの規定は、適用しない。」","reason":"処分には「その根拠となる規定が条例又は規則に置かれているものに限る」というかっこ書きが付いている。根拠が法律にある処分は外れないので、第2章と第3章が適用される。肢は、根拠が法律にあっても適用されないとしているので誤りである。"},{"label":"肢2","verdict":"×","purpose":"行政指導は、地方公共団体の機関が自分の判断でするものという性格が強い。そこで3条3項は、行政指導については、根拠がどこにあるかを問わずに全部を外した。","law":"行政手続法3条3項「地方公共団体の機関がする処分（その根拠となる規定が条例又は規則に置かれているものに限る。）及び行政指導」","reason":"「及び行政指導」の後ろには、かっこ書きがない。地方公共団体の機関がする行政指導は、根拠が法律にあっても第4章が適用されない。肢は、根拠が法律にあるものには第4章が適用されるとしているので誤りである。"},{"label":"肢3","verdict":"○","purpose":"届出は、処分と同じ扱いである。地方公共団体が自分で定めた条例または規則に根拠がある届出だけを外す。","law":"行政手続法3条3項「地方公共団体の機関に対する届出（前条第七号の通知の根拠となる規定が条例又は規則に置かれているものに限る。）」","reason":"届出にも「条例又は規則に置かれているものに限る」というかっこ書きが付いている。根拠が法律にある届出は、3条3項では外れない。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"命令等を定める行為も、行政指導と同じ扱いである。地方公共団体の機関が命令等を定める行為は、全部が第6章（意見公募手続等）の外に置かれる。","law":"行政手続法3条3項「並びに地方公共団体の機関が命令等を定める行為については、次章から第六章までの規定は、適用しない。」","reason":"「命令等を定める行為」には、かっこ書きがない。法律の委任に基づく命令等であっても、地方公共団体の機関が定めるものには第6章が適用されない。肢は、法律の委任に基づくものには第6章が適用されるとしているので誤りである。"}],"note":"3条3項の4つの扱い（「限る」が付くのは処分と届出だけ）\n処分：かっこ書き ある（条例又は規則に置かれているものに限る）／根拠が法律にあるとき 3条3項では外れない／根拠が条例・規則にあるとき 外れる\n行政指導：かっこ書き ない／根拠が法律にあるとき 外れる／根拠が条例・規則にあるとき 外れる\n届出：かっこ書き ある（条例又は規則に置かれているものに限る）／根拠が法律にあるとき 3条3項では外れない／根拠が条例・規則にあるとき 外れる\n命令等を定める行為：かっこ書き ない／根拠が法律にあるとき 外れる／根拠が条例・規則にあるとき 外れる"},"3":{"items":[{"label":"肢1","verdict":"○","purpose":"処分基準は、不利益処分をするかどうかを判断するための物差しである。12条1項は、処分基準について、定めることも公にしておくことも「努めなければならない」という形にとどめている。","law":"行政手続法12条1項「行政庁は、処分基準を定め、かつ、これを公にしておくよう努めなければならない。」","reason":"条文の結びは「努めなければならない」である。公にしておく義務までは課されていない。肢は正しい。審査基準は「公にしておかなければならない」（5条3項）なので、結びの言葉が違う。"},{"label":"肢2","verdict":"×","purpose":"2条8号は、審査基準と処分基準を別々に定義している。申請に対する処分の物差しが審査基準で、不利益処分の物差しが処分基準である。","law":"行政手続法2条8号ロ「審査基準（申請により求められた許認可等をするかどうかをその法令の定めに従って判断するために必要とされる基準をいう。以下同じ。）」\n行政手続法2条8号ハ「処分基準（不利益処分をするかどうか又はどのような不利益処分とするかについてその法令の定めに従って判断するために必要とされる基準をいう。以下同じ。）」","reason":"肢の文は、「不利益処分をするかどうか、またはどのような不利益処分とするか」の基準を述べている。これは処分基準の定義である。肢はこれを審査基準の定義としているので誤りである。"},{"label":"肢3","verdict":"×","purpose":"基準があいまいでは、物差しの役に立たない。そこで行政手続法は、審査基準にも処分基準にも、できる限り具体的にすることを求めている。","law":"行政手続法5条2項「行政庁は、審査基準を定めるに当たっては、許認可等の性質に照らしてできる限り具体的なものとしなければならない。」\n行政手続法12条2項「行政庁は、処分基準を定めるに当たっては、不利益処分の性質に照らしてできる限り具体的なものとしなければならない。」","reason":"12条2項が、処分基準についても「できる限り具体的なものとしなければならない」と定めている。肢は、処分基準には具体的なものとすべき旨の定めがないとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"審査基準を公にするのは、申請をしようとする人が、どうすれば許認可等を受けられるかを前もって知ることができるようにするためである。ただし、公にすると行政に特別の支障が出る場合は除かれている。","law":"行政手続法5条3項「行政庁は、行政上特別の支障があるときを除き、法令により申請の提出先とされている機関の事務所における備付けその他の適当な方法により審査基準を公にしておかなければならない。」","reason":"条文は「行政上特別の支障があるときを除き」と定めている。肢は「行政上特別の支障があるときであっても」公にしておかなければならないとしているので誤りである。"}],"note":"審査基準と処分基準の並び\n何の物差しか：審査基準（5条） 申請により求められた許認可等をするかどうか／処分基準（12条） 不利益処分をするかどうか、どのような不利益処分とするか\n定める：審査基準（5条） 定めるものとする（1項）／処分基準（12条） 定めるよう努めなければならない（1項）\n具体的にする：審査基準（5条） できる限り具体的なものとしなければならない（2項）／処分基準（12条） できる限り具体的なものとしなければならない（2項）\n公にする：審査基準（5条） 行政上特別の支障があるときを除き、公にしておかなければならない（3項）／処分基準（12条） 公にしておくよう努めなければならない（1項）"},"4":{"items":[{"label":"肢1","verdict":"○","purpose":"理由の提示は、行政庁に慎重な判断をさせ、処分を受けた人が不服を申し立てるときの手がかりにするためにある。ただし、数字などの客観的な物差しに合わないことが申請書から明らかな場合は、理由がおのずと分かるので、求めがあったときに示せば足りる。","law":"行政手続法8条1項ただし書「ただし、法令に定められた許認可等の要件又は公にされた審査基準が数量的指標その他の客観的指標により明確に定められている場合であって、当該申請がこれらに適合しないことが申請書の記載又は添付書類その他の申請の内容から明らかであるときは、申請者の求めがあったときにこれを示せば足りる。」","reason":"肢は、要件が数量的指標その他の客観的指標で明確に定められ、適合しないことが申請書の記載から明らかな場合を述べている。8条1項ただし書のとおりなので正しい。"},{"label":"肢2","verdict":"○","purpose":"不利益処分でも、理由を示すのが原則である。差し迫った必要があるときは処分を先にしてよいが、理由を示さないままにはさせない。","law":"行政手続法14条1項ただし書「ただし、当該理由を示さないで処分をすべき差し迫った必要がある場合は、この限りでない。」\n行政手続法14条2項「行政庁は、前項ただし書の場合においては、当該名あて人の所在が判明しなくなったときその他処分後において理由を示すことが困難な事情があるときを除き、処分後相当の期間内に、同項の理由を示さなければならない。」","reason":"差し迫った必要があるときは、処分と同時に理由を示さなくてよい（1項ただし書）。その場合でも、困難な事情があるときを除き、処分後相当の期間内に理由を示さなければならない（2項）。肢は条文のとおりなので正しい。"},{"label":"肢3","verdict":"○","purpose":"申請を拒否する処分も、不利益処分も、相手方にとって不利な結論である。どちらについても、処分と同時に理由を示すことが原則とされている。","law":"行政手続法8条1項本文「行政庁は、申請により求められた許認可等を拒否する処分をする場合は、申請者に対し、同時に、当該処分の理由を示さなければならない。」\n行政手続法14条1項本文「行政庁は、不利益処分をする場合には、その名あて人に対し、同時に、当該不利益処分の理由を示さなければならない。」","reason":"8条1項本文も14条1項本文も「同時に」理由を示さなければならないと定めている。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"処分が書面でされるのに理由だけ口頭では、あとで理由を確かめることができない。そこで、処分を書面でするときは理由も書面で示すことにしている。","law":"行政手続法8条2項「前項本文に規定する処分を書面でするときは、同項の理由は、書面により示さなければならない。」\n行政手続法14条3項「不利益処分を書面でするときは、前二項の理由は、書面により示さなければならない。」","reason":"申請を拒否する処分にも、8条2項がある。処分を書面でするときは、理由を書面で示さなければならない。肢は、申請を拒否する処分なら理由を口頭で示すことが認められているとしているので誤りである。この問の正答はこの肢である。"}],"note":"理由の提示の並び（申請を拒否する処分と不利益処分）\n原則：申請を拒否する処分（8条） 処分と同時に理由を示す（1項本文）／不利益処分（14条） 処分と同時に理由を示す（1項本文）\n例外：申請を拒否する処分（8条） 客観的指標に適合しないことが申請の内容から明らかなときは、求めがあったときに示せば足りる（1項ただし書）／不利益処分（14条） 差し迫った必要があるときは同時でなくてよい（1項ただし書）。困難な事情があるときを除き、処分後相当の期間内に示す（2項）\n処分を書面でするとき：申請を拒否する処分（8条） 理由も書面で示す（2項）／不利益処分（14条） 理由も書面で示す（3項）"},"5":{"items":[{"label":"肢1","verdict":"×","purpose":"13条1項は、不利益処分の重さに応じて、相手方が反論する手続を二つに分けている。重い処分には、ていねいな手続である聴聞を使う。","law":"行政手続法13条1項1号「次のいずれかに該当するとき　聴聞」\n行政手続法13条1項1号ロ「イに規定するもののほか、名あて人の資格又は地位を直接にはく奪する不利益処分をしようとするとき。」","reason":"名あて人の資格または地位を直接にはく奪する不利益処分は、1号ロに当たるので、聴聞を執る。肢は、弁明の機会の付与の手続を執らなければならないとしているので誤りである。"},{"label":"肢2","verdict":"×","purpose":"聴聞の対象は重い処分に限られない。軽い処分でも、行政庁がていねいな手続にしたほうがよいと判断すれば、聴聞を選ぶことができる。","law":"行政手続法13条1項1号ニ「イからハまでに掲げる場合以外の場合であって行政庁が相当と認めるとき。」\n行政手続法13条1項2号「前号イからニまでのいずれにも該当しないとき　弁明の機会の付与」","reason":"許認可等の効力を一定期間停止する処分は、イからハまでに当たらないので、ふつうは弁明の機会の付与になる。しかし、行政庁が相当と認めるときは聴聞を執る（1号ニ）。肢は、相当と認めるときでも聴聞を執ることはできないとしているので誤りである。"},{"label":"肢3","verdict":"○","purpose":"13条2項は、聴聞も弁明の機会の付与も執らなくてよい場合を定めている。金銭にかかわる処分は数が多く、あとで金銭で調整することもできるので、ここに入れられている。","law":"行政手続法13条2項「次の各号のいずれかに該当するときは、前項の規定は、適用しない。」\n行政手続法13条2項4号「納付すべき金銭の額を確定し、一定の額の金銭の納付を命じ、又は金銭の給付決定の取消しその他の金銭の給付を制限する不利益処分をしようとするとき。」","reason":"金銭の給付決定を取り消す不利益処分は、2項4号に当たる。このときは1項が適用されないので、聴聞も弁明の機会の付与も要らない。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"13条は、不利益処分をしようとする場合の決まりである。何が不利益処分に当たるかは、2条4号が決めている。申請を拒否する処分は、そこから除かれている。","law":"行政手続法2条4号「不利益処分　行政庁が、法令に基づき、特定の者を名あて人として、直接に、これに義務を課し、又はその権利を制限する処分をいう。ただし、次のいずれかに該当するものを除く。」\n行政手続法2条4号ロ「申請により求められた許認可等を拒否する処分その他申請に基づき当該申請をした者を名あて人としてされる処分」","reason":"申請を拒否する処分は、不利益処分に当たらない（2条4号ロ）。したがって13条は及ばず、弁明の機会の付与を執る義務はない。肢は、弁明の機会の付与を執らなければならないとしているので誤りである。"}],"note":"意見陳述のための手続の振り分け（13条）\n許認可等を取り消す処分（1項1号イ）：手続 聴聞\n資格または地位を直接にはく奪する処分（1号ロ）：手続 聴聞\n役員の解任、従事者の解任、会員の除名を命ずる処分（1号ハ）：手続 聴聞\n上のどれでもないが、行政庁が相当と認めるとき（1号ニ）：手続 聴聞\n上のどれにも当たらないとき（2号）：手続 弁明の機会の付与\n金銭の納付を命じ、または金銭の給付を制限する処分など（2項各号）：手続 どちらも要らない\n申請を拒否する処分：手続 不利益処分ではないので、13条の外にある"},"6":{"items":[{"label":"ア","verdict":"○","purpose":"不利益処分は、名あて人のほかにも利害がある人に影響することがある。17条は、そのような人を聴聞に加える道を開いている。","law":"行政手続法17条1項「第十九条の規定により聴聞を主宰する者（以下「主宰者」という。）は、必要があると認めるときは、当事者以外の者であって当該不利益処分の根拠となる法令に照らし当該不利益処分につき利害関係を有するものと認められる者（同条第二項第六号において「関係人」という。）に対し、当該聴聞に関する手続に参加することを求め、又は当該聴聞に関する手続に参加することを許可することができる。」","reason":"主宰者は、必要があると認めるときは、利害関係を有するものと認められる者に参加を求めることができる。肢は条文のとおりなので正しい。"},{"label":"イ","verdict":"○","purpose":"行政庁が何をもとに処分しようとしているかを知らなければ、反論はできない。18条は、そのもとになる資料を見る権利を当事者に与えている。","law":"行政手続法18条1項「当事者及び当該不利益処分がされた場合に自己の利益を害されることとなる参加人（以下この条及び第二十四条第三項において「当事者等」という。）は、聴聞の通知があった時から聴聞が終結する時までの間、行政庁に対し、当該事案についてした調査の結果に係る調書その他の当該不利益処分の原因となる事実を証する資料の閲覧を求めることができる。この場合において、行政庁は、第三者の利益を害するおそれがあるときその他正当な理由があるときでなければ、その閲覧を拒むことができない。」","reason":"閲覧を求めることができる期間は、聴聞の通知があった時から聴聞が終結する時までである。行政庁は、第三者の利益を害するおそれがあるときその他正当な理由があるときでなければ拒めない。肢は条文のとおりなので正しい。"},{"label":"ウ","verdict":"○","purpose":"聴聞は、口頭でやりとりをする手続である。20条2項は、期日に当事者ができることを定めている。","law":"行政手続法20条2項「当事者又は参加人は、聴聞の期日に出頭して、意見を述べ、及び証拠書類等を提出し、並びに主宰者の許可を得て行政庁の職員に対し質問を発することができる。」","reason":"意見を述べること、証拠書類等を出すことには許可が要らない。行政庁の職員に質問を発するには、主宰者の許可が要る。肢は条文のとおりなので正しい。"},{"label":"エ","verdict":"○","purpose":"聴聞をしても、その結果が処分に生かされなければ意味がない。26条は、行政庁に、聴聞の記録と主宰者の意見を踏まえて決めることを求めている。","law":"行政手続法26条「行政庁は、不利益処分の決定をするときは、第二十四条第一項の調書の内容及び同条第三項の報告書に記載された主宰者の意見を十分に参酌してこれをしなければならない。」","reason":"行政庁は、調書の内容と報告書に記載された主宰者の意見を「十分に参酌して」決定をしなければならない。肢は条文のとおりなので正しい。4つとも正しいので、正答は「四つ」になる。"}],"note":""},"7":{"items":[{"label":"肢1","verdict":"○","purpose":"許認可の権限をちらつかせて行政指導に従わせることを防ぐためにある。権限を行使し得ると言うのなら、その根拠を相手方に示させる。","law":"行政手続法35条2項「行政指導に携わる者は、当該行政指導をする際に、行政機関が許認可等をする権限又は許認可等に基づく処分をする権限を行使し得る旨を示すときは、その相手方に対して、次に掲げる事項を示さなければならない。」\n行政手続法35条2項1号「当該権限を行使し得る根拠となる法令の条項」\n行政手続法35条2項2号「前号の条項に規定する要件」\n行政手続法35条2項3号「当該権限の行使が前号の要件に適合する理由」","reason":"示さなければならないのは、根拠となる法令の条項、その条項に規定する要件、要件に適合する理由の三つである。肢は条文のとおりなので正しい。"},{"label":"肢2","verdict":"×","purpose":"36条の2は、法律の要件に合わない行政指導を受けた相手方が、その中止などを求めることができるようにする条文である。対象は、根拠が法律に置かれている行政指導に限られている。","law":"行政手続法36条の2第1項「法令に違反する行為の是正を求める行政指導（その根拠となる規定が法律に置かれているものに限る。）の相手方は、当該行政指導が当該法律に規定する要件に適合しないと思料するときは、当該行政指導をした行政機関に対し、その旨を申し出て、当該行政指導の中止その他必要な措置をとることを求めることができる。」","reason":"条文は、行政指導に「その根拠となる規定が法律に置かれているものに限る」というかっこ書きを付けている。肢は「根拠となる規定が法律に置かれているか否かにかかわらず」求めることができるとしているので誤りである。この問の正答はこの肢である。"},{"label":"肢3","verdict":"○","purpose":"同じ目的で多くの人に行政指導をするとき、人によって扱いが違っては不公平になる。36条は、前もって指針を定めて公表させ、扱いをそろえさせる。","law":"行政手続法36条「同一の行政目的を実現するため一定の条件に該当する複数の者に対し行政指導をしようとするときは、行政機関は、あらかじめ、事案に応じ、行政指導指針を定め、かつ、行政上特別の支障がない限り、これを公表しなければならない。」","reason":"肢は36条のとおりなので正しい。"},{"label":"肢4","verdict":"○","purpose":"36条の3は、法令違反があるのに行政が動かないとき、だれでも処分や行政指導をするよう求めることができるようにする条文である。","law":"行政手続法36条の3第1項「何人も、法令に違反する事実がある場合において、その是正のためにされるべき処分又は行政指導（その根拠となる規定が法律に置かれているものに限る。）がされていないと思料するときは、当該処分をする権限を有する行政庁又は当該行政指導をする権限を有する行政機関に対し、その旨を申し出て、当該処分又は行政指導をすることを求めることができる。」","reason":"申出ができるのは「何人も」である。肢は処分について述べており、条文のとおりなので正しい。「法律に置かれているものに限る」というかっこ書きは、直前の「行政指導」に付いている。"}],"note":"中止等の求めと、処分等の求め\n求めることができる人：行政指導の中止等の求め（36条の2） 行政指導の相手方／処分等の求め（36条の3） 何人も\n対象：行政指導の中止等の求め（36条の2） 法令に違反する行為の是正を求める行政指導（根拠が法律に置かれているものに限る）／処分等の求め（36条の3） 処分、または行政指導（根拠が法律に置かれているものに限る）\n求める内容：行政指導の中止等の求め（36条の2） 行政指導の中止その他必要な措置／処分等の求め（36条の3） 処分または行政指導をすること"},"8":{"items":[{"label":"肢1","verdict":"○","purpose":"意見公募手続は、命令等を定める前に広く意見を聞く手続である。意見を出すための期間は30日以上が原則である。40条1項は、やむを得ない理由があるときの例外を定め、その理由を明らかにさせている。","law":"行政手続法40条1項「命令等制定機関は、命令等を定めようとする場合において、三十日以上の意見提出期間を定めることができないやむを得ない理由があるときは、前条第三項の規定にかかわらず、三十日を下回る意見提出期間を定めることができる。この場合においては、当該命令等の案の公示の際その理由を明らかにしなければならない。」","reason":"やむを得ない理由があるときは、30日を下回る期間を定めることができる。そのときは、案の公示の際に理由を明らかにしなければならない。肢は条文のとおりなので正しい。"},{"label":"肢2","verdict":"×","purpose":"意見を集めただけで、どう扱ったかが分からなければ、手続の意味がない。43条1項は、結果を公示させている。","law":"行政手続法43条1項「命令等制定機関は、意見公募手続を実施して命令等を定めた場合には、当該命令等の公布（公布をしないものにあっては、公にする行為。第五項において同じ。）と同時期に、次に掲げる事項を公示しなければならない。」\n行政手続法43条1項3号「提出意見（提出意見がなかった場合にあっては、その旨）」\n行政手続法43条1項4号「提出意見を考慮した結果（意見公募手続を実施した命令等の案と定めた命令等との差異を含む。）及びその理由」","reason":"公示する事項には、提出意見のほかに、提出意見を考慮した結果とその理由が入っている（4号）。肢は、考慮した結果と理由は公示すべき事項に含まれていないとしているので誤りである。"},{"label":"肢3","verdict":"×","purpose":"命令等は、多くの人にかかわる決まりである。39条1項は、意見を出せる人を限らず、広く一般から意見を求めることにしている。","law":"行政手続法39条1項「命令等制定機関は、命令等を定めようとする場合には、当該命令等の案（命令等で定めようとする内容を示すものをいう。以下同じ。）及びこれに関連する資料をあらかじめ公示し、意見（情報を含む。以下同じ。）の提出先及び意見の提出のための期間（以下「意見提出期間」という。）を定めて広く一般の意見を求めなければならない。」","reason":"条文は「広く一般の意見を求めなければならない」と定めている。意見を出せる人を利害関係を有する者に限る定めはない。肢は誤りである。"},{"label":"肢4","verdict":"×","purpose":"意見公募手続は、多数決の手続ではない。42条が求めているのは、出された意見の中身をよく考えることである。","law":"行政手続法42条「命令等制定機関は、意見公募手続を実施して命令等を定める場合には、意見提出期間内に当該命令等制定機関に対し提出された当該命令等の案についての意見（以下「提出意見」という。）を十分に考慮しなければならない。」","reason":"義務は「十分に考慮しなければならない」ことである。同じ趣旨の意見が多くても、その意見に従う義務はない。肢は誤りである。"}],"note":""},"9":{"items":[{"label":"空欄ア","verdict":"相手方","purpose":"行政不服審査法は、国民の権利利益の救済のための法律である。そこで7条2項は、国の機関や地方公共団体が、行政どうしの特別な立場で受ける処分を、この法律の外に置いている。","law":"行政不服審査法7条2項「国の機関又は地方公共団体その他の公共団体若しくはその機関に対する処分で、これらの機関又は団体がその固有の資格において当該処分の相手方となるもの及びその不作為については、この法律の規定は、適用しない。」\n行政手続法4条1項「国の機関又は地方公共団体若しくはその機関に対する処分（これらの機関又は団体がその固有の資格において当該処分の名あて人となるものに限る。）」","reason":"行政不服審査法7条2項の言葉は「相手方」である。「名あて人」は行政手続法4条1項の言葉である。考え方は同じだが、法律によって言葉が違う。選択肢2は「名あて人」を入れているので誤りになる。"},{"label":"空欄イ","verdict":"一般私人","purpose":"「固有の資格」とは何かを、判決が言いかえている。物差しは、ふつうの私人が同じ立場に立てるかどうかである。","law":"最高裁令和2年3月26日第一小法廷判決（民集74巻3号471頁）「同項にいう「固有の資格」とは、国の機関等であるからこそ立ち得る特有の立場、すなわち、一般私人（国及び国の機関等を除く者をいう。以下同じ。）が立ち得ないような立場をいうものと解するのが相当である。」","reason":"判決は、固有の資格を「一般私人が立ち得ないような立場」と言いかえている。選択肢1は「地方公共団体」を入れているので誤りになる。"},{"label":"空欄ウ","verdict":"審査の対象","purpose":"固有の資格に当たるかどうかを、処分のどこを見て判断するのかを、判決が示している。","law":"最高裁令和2年3月26日第一小法廷判決（民集74巻3号471頁）「国の機関等が一般私人が立ち得ないような立場において相手方となる処分であるか否かを検討するに当たっては、当該処分に係る規律のうち、当該処分に対する不服申立てにおいて審査の対象となるべきものに着目すべきである。」","reason":"判決は、不服申立てにおいて「審査の対象」となるべき規律に着目すべきだとしている。選択肢1は「処分の根拠」を入れているので誤りになる。"},{"label":"空欄エ","verdict":"当たらない","purpose":"判決の結論である。埋立ての承認を国の機関が受ける場合に、行政不服審査法を使えるかどうかが決まる。","law":"最高裁令和2年3月26日第一小法廷判決（民集74巻3号471頁）の裁判要旨「公有水面埋立法42条1項に基づく埋立ての承認は、国の機関が行政不服審査法7条2項にいう「固有の資格」において相手方となるものということはできない。」","reason":"判決は、埋立ての承認は固有の資格において相手方となるものに「当たらない」と判断した。当たらないので、7条2項の適用除外にならず、行政不服審査法が適用される。選択肢3は「当たる」を入れているので誤りになる。ア・イ・ウ・エがすべて合うのは選択肢4である。"}],"note":"同じ考え方で、言葉が違う\n行政不服審査法：条文 7条2項／言葉 固有の資格において当該処分の「相手方」となるもの\n行政手続法：条文 4条1項／言葉 固有の資格において当該処分の「名あて人」となるもの"},"10":{"items":[{"label":"肢1","verdict":"×","purpose":"4条は、審査請求をどこに出すかを決める条文である。処分をした組織の中で、できるだけ上の立場の行政庁に見直しをさせる。","law":"行政不服審査法4条3号「主任の大臣が処分庁等の上級行政庁である場合（前二号に掲げる場合を除く。）　当該主任の大臣」\n行政不服審査法4条4号「前三号に掲げる場合以外の場合　当該処分庁等の最上級行政庁」","reason":"上級行政庁がある場合の出し先は、庁の長、主任の大臣、最上級行政庁のいずれかである。「直近の上級行政庁」という定めはない。肢は、常に直近の上級行政庁に対してするとしているので誤りである。"},{"label":"肢2","verdict":"○","purpose":"4条は、処分庁と不作為庁をまとめて「処分庁等」と呼んでいる。処分についての審査請求にも、不作為についての審査請求にも、同じ決まりを当てはめるためである。","law":"行政不服審査法4条柱書「審査請求は、法律（条例に基づく処分については、条例）に特別の定めがある場合を除くほか、次の各号に掲げる場合の区分に応じ、当該各号に定める行政庁に対してするものとする。」\n行政不服審査法4条1号「処分庁等（処分をした行政庁（以下「処分庁」という。）又は不作為に係る行政庁（以下「不作為庁」という。）をいう。以下同じ。）に上級行政庁がない場合又は処分庁等が主任の大臣若しくは宮内庁長官若しくは内閣府設置法（平成十一年法律第八十九号）第四十九条第一項若しくは第二項若しくは国家行政組織法（昭和二十三年法律第百二十号）第三条第二項に規定する庁の長である場合　当該処分庁等」","reason":"1号は「処分庁等に上級行政庁がない場合」の出し先を「当該処分庁等」としている。不作為庁に上級行政庁がない場合は、当該不作為庁に対してする。肢は正しい。"},{"label":"肢3","verdict":"×","purpose":"庁の長は、大臣の下にあるが、独立性の高い機関の長である。そこで4条2号は、庁の長が上級行政庁であるときは、大臣まで上げずに庁の長に出すことにしている。","law":"行政不服審査法4条2号「宮内庁長官又は内閣府設置法第四十九条第一項若しくは第二項若しくは国家行政組織法第三条第二項に規定する庁の長が処分庁等の上級行政庁である場合　宮内庁長官又は当該庁の長」\n行政不服審査法4条3号「主任の大臣が処分庁等の上級行政庁である場合（前二号に掲げる場合を除く。）　当該主任の大臣」","reason":"庁の長が上級行政庁である場合は、2号によって当該庁の長に対してする。3号は「前二号に掲げる場合を除く」としているので、主任の大臣には行かない。肢は、主任の大臣に対してするとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"主任の大臣は、その事務について最も上の立場にある。そこで4条1号は、大臣が処分庁であるときは、その大臣自身に出すことにしている。","law":"行政不服審査法4条1号「処分庁等（処分をした行政庁（以下「処分庁」という。）又は不作為に係る行政庁（以下「不作為庁」という。）をいう。以下同じ。）に上級行政庁がない場合又は処分庁等が主任の大臣若しくは宮内庁長官若しくは内閣府設置法（平成十一年法律第八十九号）第四十九条第一項若しくは第二項若しくは国家行政組織法（昭和二十三年法律第百二十号）第三条第二項に規定する庁の長である場合　当該処分庁等」","reason":"1号は「処分庁等が主任の大臣である場合」の出し先を「当該処分庁等」としている。大臣が処分庁なら、その大臣に対してする。肢は、内閣総理大臣に対してするとしているので誤りである。"}],"note":"審査請求の出し先（4条。法律または条例に特別の定めがある場合を除く）\n処分庁等に上級行政庁がない（1号）：出し先 当該処分庁等\n処分庁等が主任の大臣、宮内庁長官、庁の長である（1号）：出し先 当該処分庁等\n宮内庁長官または庁の長が上級行政庁である（2号）：出し先 宮内庁長官または当該庁の長\n主任の大臣が上級行政庁である（3号。1号・2号の場合を除く）：出し先 当該主任の大臣\n上のどれでもない（4号）：出し先 最上級行政庁"},"11":{"items":[{"label":"肢1","verdict":"○","purpose":"再調査の請求は、処分庁自身に見直しを求める簡単な手続である。これを選んだ人は、まずその結論を待つのが筋である。ただし、処分庁がいつまでも決定をしないときに先へ進めないのでは困るので、3月という区切りが置かれている。","law":"行政不服審査法5条2項「前項本文の規定により再調査の請求をしたときは、当該再調査の請求についての決定を経た後でなければ、審査請求をすることができない。ただし、次の各号のいずれかに該当する場合は、この限りでない。」\n行政不服審査法5条2項1号「当該処分につき再調査の請求をした日（第六十一条において読み替えて準用する第二十三条の規定により不備を補正すべきことを命じられた場合にあっては、当該不備を補正した日）の翌日から起算して三月を経過しても、処分庁が当該再調査の請求につき決定をしない場合」","reason":"原則は、決定を経た後でなければ審査請求ができない。請求をした日の翌日から3月を経過しても決定がない場合は、決定を経ないで審査請求ができる。肢は正しい。"},{"label":"肢2","verdict":"○","purpose":"再調査の請求と審査請求は、どちらかを選ぶ関係にある。審査庁による審理を選んだ人が、あとから処分庁による見直しに戻ることは認めていない。","law":"行政不服審査法5条1項「行政庁の処分につき処分庁以外の行政庁に対して審査請求をすることができる場合において、法律に再調査の請求をすることができる旨の定めがあるときは、当該処分に不服がある者は、処分庁に対して再調査の請求をすることができる。ただし、当該処分について第二条の規定により審査請求をしたときは、この限りでない。」","reason":"1項ただし書は、審査請求をしたときは再調査の請求ができないと定めている。肢は正しい。"},{"label":"肢3","verdict":"×","purpose":"審査請求期間は、処分をいつまでも争える状態にしないためにある。再調査の請求を経た人は、すでに一度争っているので、次の審査請求までの期間は短くされている。","law":"行政不服審査法18条1項「処分についての審査請求は、処分があったことを知った日の翌日から起算して三月（当該処分について再調査の請求をしたときは、当該再調査の請求についての決定があったことを知った日の翌日から起算して一月）を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。」","reason":"再調査の請求についての決定を経た後の審査請求期間は、決定があったことを知った日の翌日から起算して「一月」である。肢は「3月」としているので誤りである。この問の正答はこの肢である。"},{"label":"肢4","verdict":"○","purpose":"再審査請求は、審査請求の裁決にも不服がある人のための、もう一段の手続である。法律に定めがある場合にだけ認められる。","law":"行政不服審査法6条1項「行政庁の処分につき法律に再審査請求をすることができる旨の定めがある場合には、当該処分についての審査請求の裁決に不服がある者は、再審査請求をすることができる。」\n行政不服審査法6条2項「再審査請求は、原裁決（再審査請求をすることができる処分についての審査請求の裁決をいう。以下同じ。）又は当該処分（以下「原裁決等」という。）を対象として、前項の法律に定める行政庁に対してするものとする。」","reason":"対象は「原裁決又は当該処分」で、どちらを対象にしてもよい。出し先は、再審査請求ができる旨を定める法律に定める行政庁である。肢は正しい。"}],"note":"審査請求期間（18条。正当な理由があるときを除く）\n再調査の請求をしていない：知った日の翌日から 処分があったことを知った日の翌日から3月／あった日の翌日から 処分があった日の翌日から1年\n再調査の請求をした：知った日の翌日から 決定があったことを知った日の翌日から1月／あった日の翌日から 決定があった日の翌日から1年"},"12":{"items":[{"label":"肢1","verdict":"○","purpose":"不作為が違法または不当だと宣言するだけでは、申請をした人は処分を受けられないままになる。そこで49条3項は、審査庁が、処分をさせるところまで進めることができるようにしている。","law":"行政不服審査法49条3項「不作為についての審査請求が理由がある場合には、審査庁は、裁決で、当該不作為が違法又は不当である旨を宣言する。この場合において、次の各号に掲げる審査庁は、当該申請に対して一定の処分をすべきものと認めるときは、当該各号に定める措置をとる。」\n行政不服審査法49条3項1号「不作為庁の上級行政庁である審査庁　当該不作為庁に対し、当該処分をすべき旨を命ずること。」","reason":"審査庁は、裁決で不作為が違法または不当である旨を宣言する。上級行政庁である審査庁は、一定の処分をすべきものと認めるときは、不作為庁に処分をすべき旨を命ずる。肢は正しい。"},{"label":"肢2","verdict":"×","purpose":"不作為についての審査請求は、申請をしたのに応答がない人を救うための手続である。だから、できるのは申請をした人である。","law":"行政不服審査法3条「法令に基づき行政庁に対して処分についての申請をした者は、当該申請から相当の期間が経過したにもかかわらず、行政庁の不作為（法令に基づく申請に対して何らの処分をもしないことをいう。以下同じ。）がある場合には、次条の定めるところにより、当該不作為についての審査請求をすることができる。」","reason":"条文は「申請をした者は」と定めている。利害関係があるだけで、申請をしていない人は、不作為についての審査請求ができない。肢は誤りである。"},{"label":"肢3","verdict":"×","purpose":"審査請求書の記載事項は、審査庁が、何について争われているのかを知るためにある。不作為の場合は、どの申請がいつされたのかが分からなければ審理ができない。","law":"行政不服審査法19条3項「不作為についての審査請求書には、次に掲げる事項を記載しなければならない。」\n行政不服審査法19条3項1号「審査請求人の氏名又は名称及び住所又は居所」\n行政不服審査法19条3項2号「当該不作為に係る処分についての申請の内容及び年月日」\n行政不服審査法19条3項3号「審査請求の年月日」","reason":"2号が、申請の内容と年月日を記載事項にしている。肢は、これを記載することは要しないとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"弁明書は、処分庁等の言い分を書面で出させるものである。不作為の場合は、なぜ処分をしていないのかに加えて、いつどのような処分をするつもりかも書かせる。","law":"行政不服審査法29条3項2号「不作為についての審査請求に対する弁明書　処分をしていない理由並びに予定される処分の時期、内容及び理由」","reason":"不作為についての弁明書には、処分をしていない理由のほかに、予定される処分の時期、内容および理由を書く。肢は、これらを記載することは要しないとしているので誤りである。"}],"note":""},"13":{"items":[{"label":"ア","verdict":"○","purpose":"代理人は、本人に代わって手続を進める人である。12条2項は、代理人に広い権限を与えている。ただし、取下げは審査請求そのものを終わらせる行為なので、特別の委任を求めて本人を守っている。","law":"行政不服審査法12条2項「前項の代理人は、各自、審査請求人のために、当該審査請求に関する一切の行為をすることができる。ただし、審査請求の取下げは、特別の委任を受けた場合に限り、することができる。」","reason":"特別の委任が要るのは、取下げだけである。肢は、取下げを除いた行為（反論書の提出など）について、特別の委任がなくてもできると述べている。条文の本文のとおりなので正しい。"},{"label":"イ","verdict":"×","purpose":"審査請求書に不備があるだけで門前払いにすると、国民の救済の道が閉ざされる。そこで23条は、まず直す機会を与えることを審査庁の義務にしている。","law":"行政不服審査法23条「審査請求書が第十九条の規定に違反する場合には、審査庁は、相当の期間を定め、その期間内に不備を補正すべきことを命じなければならない。」\n行政不服審査法24条1項「前条の場合において、審査請求人が同条の期間内に不備を補正しないときは、審査庁は、次節に規定する審理手続を経ないで、第四十五条第一項又は第四十九条第一項の規定に基づき、裁決で、当該審査請求を却下することができる。」\n行政不服審査法24条2項「審査請求が不適法であって補正することができないことが明らかなときも、前項と同様とする。」","reason":"補正することができる不備については、審査庁は補正を「命じなければならない」。審理手続を経ないで却下できるのは、期間内に補正しないときと、補正できないことが明らかなときである。肢は、補正できる不備でも直ちに却下できるとしているので誤りである。"},{"label":"ウ","verdict":"×","purpose":"取下げは、審査請求を終わらせる行為である。本当に取り下げたのかどうかをはっきりさせるために、27条2項は書面を求めている。","law":"行政不服審査法27条2項「審査請求の取下げは、書面でしなければならない。」","reason":"27条2項には例外がない。口頭で審査請求をすることができる場合であっても、取下げは書面でしなければならない。肢は誤りである。"},{"label":"エ","verdict":"○","purpose":"審査請求期間は、処分をいつまでも争える状態にしないためにある。知った日から数える期間と、処分の日から数える期間の二つがある。","law":"行政不服審査法18条1項「処分についての審査請求は、処分があったことを知った日の翌日から起算して三月（当該処分について再調査の請求をしたときは、当該再調査の請求についての決定があったことを知った日の翌日から起算して一月）を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。」\n行政不服審査法18条2項「処分についての審査請求は、処分（当該処分について再調査の請求をしたときは、当該再調査の請求についての決定）があった日の翌日から起算して一年を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。」","reason":"再調査の請求をしていない場合は、知った日の翌日から3月を経過したとき、または処分があった日の翌日から1年を経過したときは、審査請求ができない。どちらにも、正当な理由があるときの例外がある。肢は正しい。正しいものはアとエなので、正答は「二つ」になる。"}],"note":""},"14":{"items":[{"label":"肢1","verdict":"○","purpose":"審理は、処分庁等が何について争われているのかを知ることから始まる。29条1項は、審理員に、審査請求書の写しをすぐに処分庁等へ送らせる。","law":"行政不服審査法29条1項「審理員は、審査庁から指名されたときは、直ちに、審査請求書又は審査請求録取書の写しを処分庁等に送付しなければならない。ただし、処分庁等が審査庁である場合には、この限りでない。」","reason":"審理員は、指名されたら「直ちに」写しを送る。処分庁等が審査庁である場合は、送る必要がない。肢は条文のとおりなので正しい。"},{"label":"肢2","verdict":"○","purpose":"反論書は、処分庁等の弁明書に対して、審査請求人が言い返すための書面である。出すかどうかは審査請求人が決める。審理を長引かせないために、審理員は期間を定めることができる。","law":"行政不服審査法30条1項「審査請求人は、前条第五項の規定により送付された弁明書に記載された事項に対する反論を記載した書面（以下「反論書」という。）を提出することができる。この場合において、審理員が、反論書を提出すべき相当の期間を定めたときは、その期間内にこれを提出しなければならない。」","reason":"反論書は「提出することができる」。審理員が期間を定めたときは、その期間内に出さなければならない。肢は条文のとおりなので正しい。"},{"label":"肢3","verdict":"○","purpose":"審理員は、審理を終えたら、どのような裁決をすべきかについての意見を審査庁に伝える。41条と42条は、その段取りを定めている。","law":"行政不服審査法41条1項「審理員は、必要な審理を終えたと認めるときは、審理手続を終結するものとする。」\n行政不服審査法42条1項「審理員は、審理手続を終結したときは、遅滞なく、審査庁がすべき裁決に関する意見書（以下「審理員意見書」という。）を作成しなければならない。」\n行政不服審査法42条2項「審理員は、審理員意見書を作成したときは、速やかに、これを事件記録とともに、審査庁に提出しなければならない。」","reason":"終結したら「遅滞なく」審理員意見書を作る。作ったら「速やかに」事件記録とともに審査庁に出す。肢は条文のとおりなので正しい。"},{"label":"肢4","verdict":"×","purpose":"口頭意見陳述は、申立人が口頭で意見を述べる場である。その場に関係する人がそろっていれば、処分庁等への質問もでき、審理が一度で進む。そこで31条2項は、全ての審理関係人を呼ぶことにしている。","law":"行政不服審査法31条2項「前項本文の規定による意見の陳述（以下「口頭意見陳述」という。）は、審理員が期日及び場所を指定し、全ての審理関係人を招集してさせるものとする。」\n行政不服審査法28条「審査請求人、参加人及び処分庁等（以下「審理関係人」という。）並びに審理員は、簡易迅速かつ公正な審理の実現のため、審理において、相互に協力するとともに、審理手続の計画的な進行を図らなければならない。」","reason":"招集するのは「全ての審理関係人」である。審理関係人とは、審査請求人、参加人、処分庁等をいう（28条）。肢は、申立てをした者と処分庁等だけで足りるとしているので誤りである。この問の正答はこの肢である。"}],"note":""},"15":{"items":[{"label":"肢1","verdict":"○","purpose":"処分を変更するということは、審査庁が処分の中身を自分で決め直すことである。それができるのは、処分庁自身か、処分庁を指揮監督する上級行政庁に限られる。そのどちらでもない審査庁には、取消しまでしか認めていない。","law":"行政不服審査法46条1項「処分（事実上の行為を除く。以下この条及び第四十八条において同じ。）についての審査請求が理由がある場合（前条第三項の規定の適用がある場合を除く。）には、審査庁は、裁決で、当該処分の全部若しくは一部を取り消し、又はこれを変更する。ただし、審査庁が処分庁の上級行政庁又は処分庁のいずれでもない場合には、当該処分を変更することはできない。」","reason":"ただし書は、審査庁が処分庁の上級行政庁でも処分庁でもない場合には、処分を変更することはできないと定めている。取り消すことはできる。肢は正しい。"},{"label":"肢2","verdict":"×","purpose":"裁決書は、審査庁が何を争いとしてとらえ、どのように判断したかを、審査請求人に分かる形で残すものである。そこで50条1項は、4つの事項を書かせている。","law":"行政不服審査法50条1項「裁決は、次に掲げる事項を記載し、審査庁が記名押印した裁決書によりしなければならない。」\n行政不服審査法50条1項1号「主文」\n行政不服審査法50条1項2号「事案の概要」\n行政不服審査法50条1項3号「審理関係人の主張の要旨」\n行政不服審査法60条1項「前二条の決定は、主文及び理由を記載し、処分庁が記名押印した決定書によりしなければならない。」","reason":"裁決書には、主文、事案の概要、審理関係人の主張の要旨、理由を書く。肢は、事案の概要と主張の要旨を書くことは要しないとしているので誤りである。主文と理由だけでよいのは、再調査の請求についての決定書である（60条1項）。"},{"label":"肢3","verdict":"×","purpose":"事実上の行為（人の収容や物の留置など）は、実際にそれをしている処分庁でなければやめることができない。そこで47条は、処分庁でない審査庁には、処分庁に命ずる形をとらせている。","law":"行政不服審査法47条「事実上の行為についての審査請求が理由がある場合（第四十五条第三項の規定の適用がある場合を除く。）には、審査庁は、裁決で、当該事実上の行為が違法又は不当である旨を宣言するとともに、次の各号に掲げる審査庁の区分に応じ、当該各号に定める措置をとる。」\n行政不服審査法47条1号「処分庁以外の審査庁　当該処分庁に対し、当該事実上の行為の全部若しくは一部を撤廃し、又はこれを変更すべき旨を命ずること。」\n行政不服審査法47条2号「処分庁である審査庁　当該事実上の行為の全部若しくは一部を撤廃し、又はこれを変更すること。」","reason":"処分庁以外の審査庁は、処分庁に対して撤廃を「命ずる」（1号）。自ら撤廃するのは、処分庁である審査庁である（2号）。肢は、処分庁以外の審査庁が自ら撤廃するとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"審理員意見書は、審査庁が裁決をするための意見である。決めるのは審査庁である。ただし、意見書と違う結論にするときは、その理由を裁決書に書かせて、いいかげんな判断を防いでいる。","law":"行政不服審査法50条1項4号「理由（第一号の主文が審理員意見書又は行政不服審査会等若しくは審議会等の答申書と異なる内容である場合には、異なることとなった理由を含む。）」","reason":"50条1項4号は、主文が審理員意見書と異なる内容である場合を予定している。審査庁は審理員意見書に拘束されない。肢は、異なる内容とすることはできないとしているので誤りである。"}],"note":"審査庁の立場と、認容の裁決でできること\n処分庁である審査庁：処分（46条1項） 取消し、変更／事実上の行為（47条） 自ら撤廃し、または変更する\n処分庁の上級行政庁である審査庁：処分（46条1項） 取消し、変更／事実上の行為（47条） 処分庁に撤廃または変更を命ずる\nどちらでもない審査庁：処分（46条1項） 取消しだけ。変更はできない／事実上の行為（47条） 処分庁に撤廃を命ずる。変更を命ずることはできない"},"16":{"items":[{"label":"肢1","verdict":"○","purpose":"教示は、処分を受けた人が、不服申立てができること、どこに、いつまでに出すのかを知らないために救済の機会を失うことを防ぐためにある。","law":"行政不服審査法82条1項「行政庁は、審査請求若しくは再調査の請求又は他の法令に基づく不服申立て（以下この条において「不服申立て」と総称する。）をすることができる処分をする場合には、処分の相手方に対し、当該処分につき不服申立てをすることができる旨並びに不服申立てをすべき行政庁及び不服申立てをすることができる期間を書面で教示しなければならない。ただし、当該処分を口頭でする場合は、この限りでない。」","reason":"教示するのは、不服申立てができる旨、出し先の行政庁、期間の三つで、書面でする。処分を口頭でする場合は除かれる。肢は、処分を書面でする場合について述べており、条文のとおりなので正しい。"},{"label":"肢2","verdict":"○","purpose":"行政庁が教示をしなかったために、どこに出せばよいか分からない人が不利にならないようにする条文である。処分庁に出せば足りることにしている。","law":"行政不服審査法83条1項「行政庁が前条の規定による教示をしなかった場合には、当該処分について不服がある者は、当該処分庁に不服申立書を提出することができる。」\n行政不服審査法83条3項「第一項の規定により不服申立書の提出があった場合において、当該処分が処分庁以外の行政庁に対し審査請求をすることができる処分であるときは、処分庁は、速やかに、当該不服申立書を当該行政庁に送付しなければならない。」","reason":"教示がなかったときは、処分庁に不服申立書を出すことができる。出し先が本来は別の行政庁であるときは、処分庁が速やかにそこへ送る。肢は条文のとおりなので正しい。"},{"label":"肢3","verdict":"×","purpose":"処分の相手方でない利害関係人には、教示の書面が届かない。そこで82条2項は、利害関係人が求めたときに教示する義務を定めている。3項は、書面で求められたら書面で答えることにして、内容を確かに伝えさせる。","law":"行政不服審査法82条2項「行政庁は、利害関係人から、当該処分が不服申立てをすることができる処分であるかどうか並びに当該処分が不服申立てをすることができるものである場合における不服申立てをすべき行政庁及び不服申立てをすることができる期間につき教示を求められたときは、当該事項を教示しなければならない。」\n行政不服審査法82条3項「前項の場合において、教示を求めた者が書面による教示を求めたときは、当該教示は、書面でしなければならない。」","reason":"書面による教示を求められたときは、教示は書面でしなければならない。肢は、口頭で教示すれば足りるとしているので誤りである。この問の正答はこの肢である。"},{"label":"肢4","verdict":"○","purpose":"行政庁が出し先をまちがえて教示したときに、それを信じた人が不利にならないようにする条文である。まちがった出し先に届いた審査請求書を、正しいところへ回させる。","law":"行政不服審査法22条1項「審査請求をすることができる処分につき、処分庁が誤って審査請求をすべき行政庁でない行政庁を審査請求をすべき行政庁として教示した場合において、その教示された行政庁に書面で審査請求がされたときは、当該行政庁は、速やかに、審査請求書を処分庁又は審査庁となるべき行政庁に送付し、かつ、その旨を審査請求人に通知しなければならない。」","reason":"教示された行政庁は、速やかに審査請求書を処分庁または審査庁となるべき行政庁に送り、その旨を審査請求人に通知する。肢は条文のとおりなので正しい。"}],"note":""},"17":{"items":[{"label":"肢1","verdict":"×","purpose":"民衆訴訟と機関訴訟は、自分の権利を守るための訴訟ではない。行政が法に従っているかを正すための訴訟である。5条と6条が、二つを別々に定義している。","law":"行政事件訴訟法5条「この法律において「民衆訴訟」とは、国又は公共団体の機関の法規に適合しない行為の是正を求める訴訟で、選挙人たる資格その他自己の法律上の利益にかかわらない資格で提起するものをいう。」\n行政事件訴訟法6条「この法律において「機関訴訟」とは、国又は公共団体の機関相互間における権限の存否又はその行使に関する紛争についての訴訟をいう。」","reason":"肢の文は、5条の民衆訴訟の定義である。機関訴訟は、機関相互間の権限についての紛争の訴訟である（6条）。肢は、民衆訴訟の定義を機関訴訟のものとしているので誤りである。"},{"label":"肢2","verdict":"○","purpose":"抗告訴訟は、行政庁の公権力の行使に不服がある人のための訴訟である。3条は、その中に入る訴えを一つずつ定義している。","law":"行政事件訴訟法3条1項「この法律において「抗告訴訟」とは、行政庁の公権力の行使に関する不服の訴訟をいう。」\n行政事件訴訟法3条4項「この法律において「無効等確認の訴え」とは、処分若しくは裁決の存否又はその効力の有無の確認を求める訴訟をいう。」","reason":"無効等確認の訴えの定義は、3条4項のとおりである。3条は見出しが「抗告訴訟」で、無効等確認の訴えはその中に置かれている。肢は正しい。"},{"label":"肢3","verdict":"×","purpose":"民衆訴訟と機関訴訟は、自分の権利利益を守る訴訟ではないので、だれでも起こせるわけではない。法律が特に認めた場合に、法律が認めた人だけが起こせる。","law":"行政事件訴訟法42条「民衆訴訟及び機関訴訟は、法律に定める場合において、法律に定める者に限り、提起することができる。」","reason":"条文は「法律に定める場合において、法律に定める者に限り」と定めている。肢は、法律に定める場合でなくても提起できるとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"当事者訴訟は、処分そのものを争うのではなく、公法上の法律関係を、当事者どうしの訴訟として争うものである。4条が定義している。","law":"行政事件訴訟法4条「この法律において「当事者訴訟」とは、当事者間の法律関係を確認し又は形成する処分又は裁決に関する訴訟で法令の規定によりその法律関係の当事者の一方を被告とするもの及び公法上の法律関係に関する確認の訴えその他の公法上の法律関係に関する訴訟をいう。」","reason":"公法上の法律関係に関する確認の訴えは、4条で当事者訴訟に入れられている。肢は、抗告訴訟の一類型としているので誤りである。"}],"note":"行政事件訴訟の4つの類型（2条）\n抗告訴訟：条文 3条／中身 行政庁の公権力の行使に関する不服の訴訟。処分の取消しの訴え、裁決の取消しの訴え、無効等確認の訴え、不作為の違法確認の訴え、義務付けの訴え、差止めの訴え\n当事者訴訟：条文 4条／中身 公法上の法律関係に関する確認の訴えその他の公法上の法律関係に関する訴訟など\n民衆訴訟：条文 5条／中身 法規に適合しない行為の是正を求める訴訟で、自己の法律上の利益にかかわらない資格で提起するもの\n機関訴訟：条文 6条／中身 機関相互間における権限の存否またはその行使に関する紛争についての訴訟"},"18":{"items":[{"label":"空欄ア","verdict":"法律上の利益","purpose":"不服申立ては、だれでもできるわけではない。判決は、不服申立てができる人の範囲を、「法律上の利益」がある人という言葉で区切っている。","law":"最高裁昭和53年3月14日判決（主婦連ジュース事件）「一般の行政処分についての不服申立の場合と同様に、当該処分について不服申立をする法律上の利益がある者、すなわち、当該処分により自己の権利若しくは法律上保護された利益を侵害され又は必然的に侵害されるおそれのある者をいう」","reason":"判決の言葉は「不服申立をする法律上の利益がある者」である。選択肢4は「事実上の利益」を入れているので誤りになる。"},{"label":"空欄イ","verdict":"権利","purpose":"「法律上の利益がある者」とはだれかを、判決が「すなわち」の後ろで言いかえている。侵害されるものの一つ目である。","law":"最高裁昭和53年3月14日判決（主婦連ジュース事件）「当該処分により自己の権利若しくは法律上保護された利益を侵害され」","reason":"判決の言葉は「自己の権利」である。選択肢3は「財産」を入れているので誤りになる。"},{"label":"空欄ウ","verdict":"法律上保護された利益","purpose":"侵害されるものの二つ目である。権利とまでは言えなくても、法律が守っている利益であれば、不服申立てができる。","law":"最高裁昭和53年3月14日判決（主婦連ジュース事件）「当該処分により自己の権利若しくは法律上保護された利益を侵害され」","reason":"判決の言葉は「法律上保護された利益」である。選択肢2は「法律上保護に値する利益」を入れている。これは学説の言葉で、判決の言葉ではないので誤りになる。"},{"label":"空欄エ","verdict":"必然的に","purpose":"まだ侵害されていない人でも、不服申立てができる場合がある。判決は、その場合を「必然的に侵害されるおそれ」がある場合に限っている。","law":"最高裁昭和53年3月14日判決（主婦連ジュース事件）「又は必然的に侵害されるおそれのある者をいう」","reason":"判決の言葉は「必然的に侵害されるおそれのある者」である。選択肢3は「事実上」を入れているので誤りになる。ア・イ・ウ・エがすべて合うのは選択肢1である。"}],"note":""},"19":{"items":[{"label":"肢1","verdict":"○","purpose":"審査請求ができる処分について、先に審査請求をするか、すぐに訴えるかは、本人が選べる。これが原則である。法律が特に、裁決を経た後でなければ訴えられないと定めている場合だけが例外になる。","law":"行政事件訴訟法8条1項「処分の取消しの訴えは、当該処分につき法令の規定により審査請求をすることができる場合においても、直ちに提起することを妨げない。ただし、法律に当該処分についての審査請求に対する裁決を経た後でなければ処分の取消しの訴えを提起することができない旨の定めがあるときは、この限りでない。」","reason":"原則は、直ちに訴えを提起できる。例外は、法律に裁決を経た後でなければ提起できない旨の定めがあるときである。肢は条文のとおりなので正しい。"},{"label":"肢2","verdict":"○","purpose":"取消訴訟の被告は、処分をした行政庁が属する国または公共団体である（11条1項）。行政庁がどの団体にも属していないときは、被告にすべき団体がないので、その行政庁を被告にする。","law":"行政事件訴訟法11条2項「処分又は裁決をした行政庁が国又は公共団体に所属しない場合には、取消訴訟は、当該行政庁を被告として提起しなければならない。」","reason":"行政庁が国または公共団体に所属しない場合は、当該行政庁を被告とする。肢は条文のとおりなので正しい。"},{"label":"肢3","verdict":"○","purpose":"管轄は、どこの裁判所に訴えるかの決まりである。原則の裁判所のほかに、不動産にかかわる処分では、その不動産がある場所の裁判所にも訴えることができるようにしている。","law":"行政事件訴訟法12条1項「取消訴訟は、被告の普通裁判籍の所在地を管轄する裁判所又は処分若しくは裁決をした行政庁の所在地を管轄する裁判所の管轄に属する。」\n行政事件訴訟法12条2項「土地の収用、鉱業権の設定その他不動産又は特定の場所に係る処分又は裁決についての取消訴訟は、その不動産又は場所の所在地の裁判所にも、提起することができる。」","reason":"2項は「にも」と定めている。1項の裁判所に加えて、不動産の所在地の裁判所にも提起できる。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"出訴期間は、処分の効力を早く安定させるためにある。知った日から数える6箇月と、処分の日から数える1年の二つがあり、どちらか一方でも過ぎれば訴えられない。","law":"行政事件訴訟法14条1項「取消訴訟は、処分又は裁決があつたことを知つた日から六箇月を経過したときは、提起することができない。ただし、正当な理由があるときは、この限りでない。」\n行政事件訴訟法14条2項「取消訴訟は、処分又は裁決の日から一年を経過したときは、提起することができない。ただし、正当な理由があるときは、この限りでない。」","reason":"知った日から6箇月を経過すると、正当な理由がなければ提起できない（1項）。1年の期間は、6箇月の期間を延ばすものではない。肢は、1年を経過していなければ正当な理由の有無を問わず提起できるとしているので誤りである。この問の正答はこの肢である。"}],"note":""},"20":{"items":[{"label":"肢1","verdict":"×","purpose":"行政事件訴訟は公益にかかわるので、裁判所が自分から証拠を調べることを認めている。ただし、当事者が知らないうちに調べた証拠で判決をされては困るので、当事者の意見をきくことを義務にしている。","law":"行政事件訴訟法24条「裁判所は、必要があると認めるときは、職権で、証拠調べをすることができる。ただし、その証拠調べの結果について、当事者の意見をきかなければならない。」","reason":"ただし書は、証拠調べの結果について当事者の意見を「きかなければならない」と定めている。肢は、意見をきくことを要しないとしているので誤りである。"},{"label":"肢2","verdict":"×","purpose":"処分が、原告との間では取り消され、ほかの人との間では残っているというのでは、法律関係が混乱する。そこで32条1項は、取消判決の効力を第三者にも及ぼしている。","law":"行政事件訴訟法32条1項「処分又は裁決を取り消す判決は、第三者に対しても効力を有する。」","reason":"取消判決は、第三者に対しても効力を有する。肢は、第三者に対しては効力を有しないとしているので誤りである。"},{"label":"肢3","verdict":"○","purpose":"取消訴訟は、原告自身の権利利益を守るための訴訟である。そこで10条1項は、原告の利益に関係のない違法を理由にすることを認めていない。","law":"行政事件訴訟法10条1項「取消訴訟においては、自己の法律上の利益に関係のない違法を理由として取消しを求めることができない。」","reason":"肢は10条1項のとおりなので正しい。"},{"label":"肢4","verdict":"×","purpose":"事情判決は、処分が違法でも、取り消すと公の利益に著しい障害が出るときに、請求を棄却する判決である。原告は負けるが、処分が違法であったことは判決の主文ではっきりさせる。","law":"行政事件訴訟法31条1項「取消訴訟については、処分又は裁決が違法ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合において、原告の受ける損害の程度、その損害の賠償又は防止の程度及び方法その他一切の事情を考慮したうえ、処分又は裁決を取り消すことが公共の福祉に適合しないと認めるときは、裁判所は、請求を棄却することができる。この場合には、当該判決の主文において、処分又は裁決が違法であることを宣言しなければならない。」","reason":"後段は、判決の主文において処分が違法であることを「宣言しなければならない」と定めている。肢は、宣言することを要しないとしているので誤りである。"}],"note":""},"21":{"items":[{"label":"肢1","verdict":"×","purpose":"相手方の主張に対する答え方によって、その事実を証拠で証明する必要があるかどうかが決まる。159条2項は、「知らない」と答えた場合の扱いを定めている。","law":"民事訴訟法159条2項「相手方の主張した事実を知らない旨の陳述をした者は、その事実を争ったものと推定する。」","reason":"「知らない」と述べた者は、その事実を「争ったものと推定」される。肢は、自白したものと推定されるとしているので誤りである。"},{"label":"肢2","verdict":"○","purpose":"争うのかどうかをはっきりさせない当事者がいると、審理が進まない。そこで159条1項は、はっきりさせない場合を自白として扱う。ただし、全体のやりとりから争っていると分かる場合は除く。","law":"民事訴訟法159条1項「当事者が口頭弁論において相手方の主張した事実を争うことを明らかにしない場合には、その事実を自白したものとみなす。ただし、弁論の全趣旨により、その事実を争ったものと認めるべきときは、この限りでない。」","reason":"争うことを明らかにしない場合は、自白したものと「みなす」。弁論の全趣旨により争ったものと認めるべきときは除かれる。肢は条文のとおりなので正しい。"},{"label":"肢3","verdict":"×","purpose":"証拠で証明するのは、争いがある事実である。179条は、証明が要らない事実を二つ並べている。","law":"民事訴訟法179条「裁判所において当事者が自白した事実及び顕著な事実は、証明することを要しない。」","reason":"条文は「自白した事実及び顕著な事実」は証明することを要しないと定めている。顕著な事実も証明が要らない。肢は、顕著な事実は相手方が争えば証明を要するとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"否認は、相手方の主張する事実を争うことである。争われた事実は、その事実を主張した側が証明する。否認した側に証明の負担が移るわけではない。","law":"条文はない。証明責任の分配についての一般的な考え方による。争われた事実は、その事実を主張した当事者が証明する。","reason":"否認された事実は、それを主張した相手方が立証する。否認した当事者が、その事実が存在しないことを証明する責任を負うことはない。肢は誤りである。"}],"note":"認否の4種類\n自白：意味 相手方の主張を認める／効果 証明が要らなくなる（179条）\n否認：意味 争う／効果 主張した側が立証しなければならない\n不知：意味 「知らない」と述べる／効果 争ったものと推定する（159条2項）\n沈黙：意味 争うかどうかを明らかにしない／効果 自白したものとみなす（159条1項）"},"22":{"items":[{"label":"肢1","verdict":"○","purpose":"請求原因は、原告が求める権利が発生したと言うために、原告が主張立証しなければならない事実である。貸金の返還請求では、民法587条からそれを拾う。","law":"民法587条「消費貸借は、当事者の一方が種類、品質及び数量の同じ物をもって返還をすることを約して相手方から金銭その他の物を受け取ることによって、その効力を生ずる。」","reason":"587条は、返還をすることを約すること（返還の合意）と、金銭を受け取ること（金銭の交付）の二つで消費貸借が成立すると定めている。Ｘはこの二つを主張立証しなければならない。肢は正しい。"},{"label":"肢2","verdict":"○","purpose":"貸したお金は、借主がしばらく使うことを前提にしている。貸してすぐに返せとは言えない。そこで、返還時期の合意と、その到来までを請求原因に数えるのが一般的な説明である。","law":"民法587条（肢1の解説に引用）。消費貸借は、借主に一定の期間使わせることを内容とする契約なので、返還を求めるには返還時期の合意とその到来が要ると説明される。","reason":"貸金返還請求の請求原因は、一般に、返還の合意、金銭の交付、返還時期の合意、返還時期の到来の四つと説明される。肢は、返還時期の合意とその到来も主張しなければならないとしているので正しい。"},{"label":"肢3","verdict":"○","purpose":"抗弁は、請求原因の事実を認めたうえで、それと両立する別の事実を出して、請求を退けようとする主張である。抗弁の事実は、被告が主張立証する。","law":"民法473条「債務者が債権者に対して債務の弁済をしたときは、その債権は、消滅する。」","reason":"「借りたが、全額を返済した」は、借りたことを認めている。そのうえで、弁済という別の事実を出している。借りたことと返したことは両立するので、抗弁である。主張立証責任はＹにある。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"否認か抗弁かは、被告の言い分が請求原因の事実と両立するかどうかで決まる。両立しなければ否認である。理由を付けた否認を、理由付き否認という。","law":"条文はない。否認と抗弁の区別についての一般的な考え方による。請求原因事実と両立しない事実の主張は、否認である。","reason":"「謝礼として受け取った」という主張は、金銭の交付は認めている。しかし、返還の合意は、謝礼だという理由を付けて争っている。返す約束で受け取ったことと、謝礼として受け取ったことは両立しない。これは理由を付けた否認である。肢は、両立する事実の主張で抗弁であるとしているので誤りである。この問の正答はこの肢である。"}],"note":"Ｙの言い分の仕分け（貸金返還請求）\nお金を受け取った事実はない：仕分け 否認／理由 金銭の交付と両立しない\n受け取ったが、仕事を手伝った謝礼として受け取ったものだ：仕分け 理由付き否認／理由 交付は認める。返還の合意は、謝礼という理由を付けて争っている\n借りたが、全額を返済した：仕分け 抗弁（弁済）／理由 借りたことと両立する。権利を消滅させる"},"23":{"items":[{"label":"肢1","verdict":"○","purpose":"錯誤による取消しは、思い違いをして契約をした人を守るための決まりである。訴訟では、契約をしたことは認めたうえで、その効果が生じないと主張することになる。","law":"民法95条1項「意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。」\n民法95条1項2号「表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤」\n民法95条2項「前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。」","reason":"Ｙは、甲を買ったことを認めている。そのうえで、錯誤による取消しを主張している。売買があったことと両立し、代金を支払う義務を否定する主張なので、抗弁である。肢は正しい。"},{"label":"肢2","verdict":"×","purpose":"売買では、売主は物を引き渡し、買主は代金を払う。同時履行の抗弁は、相手が履行するまで自分も履行しないと言える権利で、取引の公平を守るためにある。","law":"民法533条「双務契約の当事者の一方は、相手方がその債務の履行（債務の履行に代わる損害賠償の債務の履行を含む。）を提供するまでは、自己の債務の履行を拒むことができる。ただし、相手方の債務が弁済期にないときは、この限りでない。」","reason":"同時履行の抗弁は、履行を「拒むことができる」権利である。代金を払う義務がなくなるわけではない。権利の行使を一時的に止める抗弁である。肢は、代金支払請求権を消滅させる抗弁であるとしているので誤りである。"},{"label":"肢3","verdict":"×","purpose":"否認か抗弁かは、請求原因の事実と両立するかどうかで決まる。両立すれば抗弁である。","law":"民法473条「債務者が債権者に対して債務の弁済をしたときは、その債権は、消滅する。」","reason":"「代金は支払った」という主張は、売買があったことを前提にしている。売買と弁済は両立するので、抗弁（権利消滅の抗弁）である。肢は、両立しない事実の主張で否認であるとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"売買代金の請求で原告が主張立証すべき事実は、民法555条から拾う。555条に書かれているのは、売買の合意だけである。","law":"民法555条「売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。」","reason":"売買は、約束だけで効力を生ずる。代金の支払時期は555条に書かれていないので、請求原因にならない。肢は、支払時期の合意とその到来も主張立証しなければならないとしているので誤りである。貸金（問22）との違いがここにある。"}],"note":"抗弁の3つの型\n権利障害の抗弁：中身 契約はあるが、無効または取消しによって効果が生じない／例 虚偽表示による無効（民法94条）\n権利消滅の抗弁：中身 契約から生じた請求権が、あとで消滅した／例 弁済\n権利阻止の抗弁：中身 権利はあるが、その行使を一時的に止める／例 同時履行の抗弁（民法533条）"},"24":{"items":[{"label":"肢1","verdict":"×","purpose":"登記は、どのような登記がされているかを示すものである。だれが所有者であるかを、法律上決めてしまう力まではない。","law":"判例による。最高裁昭和34年1月8日第一小法廷判決（民集13巻1号1頁。判示事項は「登記と事実上の推定」）の裁判要旨「登記簿上の所有名義人は、反証のない限り、右不動産を所有するものと推定すべきである。」この推定は事実上の推定であり、法律上の推定ではない。","reason":"登記があっても、所有者であることが法律上推定されるわけではない。したがって、証明責任がＹに移ることもない。肢は誤りである。"},{"label":"肢2","verdict":"×","purpose":"否認か抗弁かは、請求原因の事実と両立するかどうかで決まる。この訴訟の請求原因は、Ｘが甲土地を所有していることと、Ｙが甲土地を占有していることである。","law":"条文はない。請求原因事実と両立し、その法律効果を妨げる事実の主張が、抗弁である。","reason":"「Ｘから賃借して占有している」という主張は、Ｘの所有もＹの占有も認めている。請求原因と両立する。そのうえで、占有する権利があると主張しているので、抗弁である。肢は、両立しない事実の主張で否認であるとしているので誤りである。"},{"label":"肢3","verdict":"○","purpose":"所有権があることを一から証明するには、過去の売買や相続をさかのぼらなければならない。相手方が所有を認めているなら、その手間は要らない。これを権利自白という。","law":"条文はない。所有権については、相手方が認めれば権利自白が成立し、それより前の取得原因の主張立証は要らなくなると解されている。","reason":"Ｙが、Ｘの現在の所有を認めれば、権利自白が成立する。Ｘは、所有権を取得した原因となる事実を主張立証する必要がない。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"証拠で証明するのは、争いがある事実である。相手方が認めた事実は、証明が要らない。","law":"民事訴訟法179条「裁判所において当事者が自白した事実及び顕著な事実は、証明することを要しない。」","reason":"Ｙが占有を認めていれば、占有は自白された事実になり、証明が要らない。肢は、それでも占有の開始時期と態様を具体的に主張立証しなければならないとしているので誤りである。"}],"note":""},"25":{"items":[{"label":"肢1","verdict":"○","purpose":"訴訟物は、裁判所が審理する対象である。取消訴訟では、処分のどこが違法かを一つずつ別の訴訟にするのではなく、処分が違法であること全体を一つの対象にする。","law":"条文はない。取消訴訟の訴訟物は処分の違法一般である、とするのが通説である。","reason":"取消訴訟は形成訴訟で、訴訟物は処分の違法一般と解されている。肢は正しい。"},{"label":"肢2","verdict":"○","purpose":"処分の名あて人は、自分が処分を受けているので、訴える資格があるのは当然である。名あて人でない第三者は、自分に訴える資格（原告適格）があることを、自分で示さなければならない。","law":"行政事件訴訟法9条（原告適格）。取消訴訟は、取消しを求めるにつき法律上の利益を有する者に限り、提起することができる。第三者は、この利益があることを基礎づける事実を自分で示す必要がある。","reason":"第三者が訴える場合は、違法事由のほかに、原告適格があることを主張立証する。肢は正しい。"},{"label":"肢3","verdict":"○","purpose":"不利益処分は、国民がもともと持っている権利や自由を制限する処分である。そこで、処分の要件に当たる事実があることは、処分をした行政庁の側が主張立証すると考えられている。","law":"条文はない。国民の権利や自由を制限する処分については、処分の要件に当たる事実を行政庁の側が主張立証する、という考え方が一般的である。","reason":"不利益処分の取消訴訟では、処分の要件に該当する事実があることは、一般に、行政庁の側が主張立証すべきものと解されている。肢は正しい。"},{"label":"肢4","verdict":"×","purpose":"裁量処分は、行政庁の判断にまかされた処分である。裁判所が取り消せるのは、裁量権の範囲をこえたか、濫用があった場合に限られる。","law":"行政事件訴訟法30条「行政庁の裁量処分については、裁量権の範囲をこえ又はその濫用があつた場合に限り、裁判所は、その処分を取り消すことができる。」","reason":"裁量権の逸脱または濫用に当たる事情は、取消しを求める原告が主張立証する。肢は、行政庁の側が逸脱または濫用がなかったことの証明責任を負い、原告は主張立証する必要がないとしているので誤りである。この問の正答はこの肢である。"}],"note":""},"26":{"items":[{"label":"ア","verdict":"×","purpose":"文書を証拠にするには、二つの段階がある。まず、その文書が本当に名義人の意思で作られたものかを確かめる。次に、その中身がどれだけ事実の認定に役立つかを見る。","law":"条文はない。形式的証拠力＝文書が作成名義人の意思に基づいて作成されたこと（成立の真正）。実質的証拠力＝成立の真正が認められた文書が、事実の認定に役立つ力。","reason":"形式的証拠力は、文書の成立の真正のことである。実質的証拠力は、文書が事実認定に影響する力のことである。肢は、二つの説明を入れ替えているので誤りである。"},{"label":"イ","verdict":"○","purpose":"文書が名義人の意思で作られたことを、一から証明するのはむずかしい。そこで228条4項は、署名または押印があれば、真正に成立したものと推定することにしている。","law":"民事訴訟法228条4項「私文書は、本人又はその代理人の署名又は押印があるときは、真正に成立したものと推定する。」","reason":"肢は228条4項のとおりなので正しい。"},{"label":"ウ","verdict":"×","purpose":"本人の印章による印影があれば、本人の意思で押したものと推定される。本人の意思による押印があれば、228条4項によって文書が真正に成立したものと推定される。この二段の推定が教えるのは、文書が本人の意思で作られたということまでである。","law":"民事訴訟法228条4項「私文書は、本人又はその代理人の署名又は押印があるときは、真正に成立したものと推定する。」","reason":"推定されるのは、成立の真正だけである。書かれた内容が真実であるかどうかは、実質的証拠力の問題で、推定されない。肢は、内容が真実であることも推定されるとしているので誤りである。"},{"label":"エ","verdict":"×","purpose":"文書には、契約などの法律行為そのものが書かれた文書（処分文書）と、見たことや起きたことを知らせる文書（報告文書）がある。どちらであるかによって、事実の認定に役立つ力が違う。","law":"条文はない。処分文書＝意思表示その他の法律行為が記載されている文書（契約書など）。報告文書＝作成者が見聞きした事実や判断を記載した文書（領収書、日記など）。","reason":"領収書は、お金が支払われたことを知らせる文書で、報告文書である。肢は、領収書を処分文書としているので誤りである。正しいものはイだけなので、正答は「一つ」になる。"}],"note":""},"27":{"items":[{"label":"肢1","verdict":"×","purpose":"請求の認諾は、被告が、原告の請求そのものを認めることである。当事者が自分で争いを終わらせるので、裁判所が判決をする必要はなくなる。","law":"民事訴訟法267条1項「裁判所書記官が、和解又は請求の放棄若しくは認諾について電子調書を作成し、これをファイルに記録したときは、その記録は、確定判決と同一の効力を有する。」","reason":"請求の認諾が調書に記録されると、確定判決と同一の効力を持ち、訴訟は終わる。肢は、訴訟は終了せず判決をしなければならないとしているので誤りである。なお、いまの条文は調書を「電子調書」と書いている。"},{"label":"肢2","verdict":"○","purpose":"訴えの取下げは、原告が訴訟をやめることである。しかし、被告が中身について反論を始めた後は、被告にも判決をもらって決着をつける利益がある。そこで261条2項は、被告の同意を求めている。","law":"民事訴訟法261条2項「訴えの取下げは、相手方が本案について準備書面を提出し、弁論準備手続において申述をし、又は口頭弁論をした後にあっては、相手方の同意を得なければ、その効力を生じない。」","reason":"肢は261条2項の本文のとおりなので正しい。"},{"label":"肢3","verdict":"×","purpose":"裁判上の自白は、相手方の主張する自分に不利な事実を、訴訟の中で認めることである。当事者が争わない事実について、裁判所は別の認定をしない。","law":"民事訴訟法179条「裁判所において当事者が自白した事実及び顕著な事実は、証明することを要しない。」","reason":"主要事実の自白は、裁判所を拘束する。裁判所は、証拠から別の心証を持っても、自白された事実を判決の基礎にしなければならない。肢は、自白と異なる事実を認定することができるとしているので誤りである。"},{"label":"肢4","verdict":"×","purpose":"請求の放棄は、原告が請求そのものをあきらめることである。訴えの取下げは、訴訟だけをなかったことにすることである。二つは効果が違う。","law":"民事訴訟法267条1項「裁判所書記官が、和解又は請求の放棄若しくは認諾について電子調書を作成し、これをファイルに記録したときは、その記録は、確定判決と同一の効力を有する。」\n民事訴訟法262条1項「訴訟は、訴えの取下げがあった部分については、初めから係属していなかったものとみなす。」","reason":"請求の放棄は、調書に記録されると確定判決と同一の効力を持つ。初めから係属していなかったものとみなされるのは、訴えの取下げである。肢は、放棄も取下げと同じ扱いになるとしているので誤りである。"}],"note":"似たものの違い\n裁判上の自白：何をするか 相手方の主張する事実を認める／訴訟はどうなるか 終わらない。その事実の証明が要らなくなり、裁判所を拘束する\n請求の認諾：何をするか 被告が、原告の請求そのものを認める／訴訟はどうなるか 終わる。確定判決と同一の効力（267条1項）\n請求の放棄：何をするか 原告が、請求そのものをあきらめる／訴訟はどうなるか 終わる。確定判決と同一の効力（267条1項）\n訴えの取下げ：何をするか 原告が、訴訟をやめる／訴訟はどうなるか 初めから係属していなかったものとみなす（262条1項）"},"28":{"items":[{"label":"ア","verdict":"○","purpose":"特定行政書士は、依頼者の代理人として審査請求の手続をする。二人の依頼者の利益がぶつかる事件を引き受けると、どちらかの利益を損なう。そこで54条1項は受任を禁じている。","law":"行政書士職務基本規則54条1項「特定行政書士は、審査請求手続等を行うにあたり、依頼者の利益と他の依頼者の利益が相反する事件を受任してはならない。」","reason":"結びは「受任してはならない」である。肢は条文のとおりなので正しい。"},{"label":"イ","verdict":"×","purpose":"55条は、まだ公正を保てない事由が起きてはいないが、起きるおそれがある場合の決まりである。前もって依頼者に説明し、職務を行えなくなることについて同意を得るよう求めている。","law":"行政書士職務基本規則55条「特定行政書士は、職務の公正を保ち得ない事由の発生するおそれがある場合には、あらかじめ依頼者に対し、その事情を説明し、職務を行うことができないことについて、同意を得るように努める。」","reason":"結びは「同意を得るように努める」である。努力を求める決まりで、義務ではない。肢は「同意を得なければならない」としているので誤りである。"},{"label":"ウ","verdict":"○","purpose":"依頼者の相手方と特別の関係があることを黙って引き受けると、あとで依頼者の信頼を失う。57条は、受任の際にその事情を告げることを義務にしている。","law":"行政書士職務基本規則57条「特定行政書士は、事件の受任に際して、依頼者の相手方と特別の関係があるために、依頼者との信頼関係に影響を及ぼすおそれがあるときは、依頼者に対しその事情を告げなければならない。」","reason":"結びは「告げなければならない」である。肢は条文のとおりなので正しい。"},{"label":"エ","verdict":"○","purpose":"審査請求は、簡易迅速な救済のための手続である。53条は、特定行政書士に、依頼者の権利が早く実現するよう努めることを求めている。","law":"行政書士職務基本規則53条「特定行政書士は、法第1条の3第1項第二号に定める審査請求手続等（以下「審査請求手続等」という。）を受任した場合には、依頼者の権利が速やかに実現されるように努める。」","reason":"結びは「努める」である。肢も「努める」と書いているので正しい。条文の中の「法第1条の3第1項第二号」は改正前の条番号で、いまの行政書士法では1条の4第1項2号に当たる。正しいものはア・ウ・エなので、正答は「三つ」になる。"}],"note":"第5章の条文の結びの言葉\n53条：場面 審査請求手続等を受任した場合／結び 依頼者の権利が速やかに実現されるように努める\n54条1項：場面 依頼者の利益と他の依頼者の利益が相反する事件／結び 受任してはならない\n55条：場面 職務の公正を保ち得ない事由の発生するおそれがある場合／結び 同意を得るように努める\n57条：場面 依頼者の相手方と特別の関係がある場合／結び 事情を告げなければならない"},"29":{"items":[{"label":"ア","verdict":"○","purpose":"1条は、行政書士が何のために仕事をするのかを定める条文である。改正によって、行政書士法の1条が使命を定める条文になった。","law":"行政書士法1条「行政書士は、その業務を通じて、行政に関する手続の円滑な実施に寄与するとともに国民の利便に資し、もつて国民の権利利益の実現に資することを使命とする。」","reason":"肢は1条のとおりなので正しい。"},{"label":"イ","verdict":"×","purpose":"1条の4第1項2号は、特定行政書士が不服申立ての手続を代理できる範囲を定めている。改正後は、行政書士が「作成することができる」書類に係る許認可等であれば、実際にだれが書類を作ったかを問わない。","law":"行政書士法1条の4第1項2号「前条の規定により行政書士が作成することができる官公署に提出する書類に係る許認可等に関する審査請求、再調査の請求、再審査請求等行政庁に対する不服申立ての手続について代理し、及びその手続について官公署に提出する書類を作成すること。」\n行政書士法1条の4第2項「前項第二号に掲げる業務は、当該業務について日本行政書士会連合会がその会則で定めるところにより実施する研修の課程を修了した行政書士（以下「特定行政書士」という。）に限り、行うことができる。」","reason":"条文の言葉は「行政書士が作成することができる」書類である。申請者本人が作った書類に係る許認可等についての不服申立ても、代理できる。肢は、行政書士が現に作成した書類に係るものに限られるとしているので誤りである。"},{"label":"ウ","verdict":"○","purpose":"19条1項は、行政書士でない人が、報酬を得て行政書士の業務をすることを禁じている。国民が、資格のない人に頼んで不利益を受けることを防ぐためである。「いかなる名目によるかを問わず」という言葉で、名目を変えて報酬を受け取る抜け道をふさいでいる。","law":"行政書士法19条1項「行政書士又は行政書士法人でない者は、他人の依頼を受けいかなる名目によるかを問わず報酬を得て、業として第一条の三に規定する業務を行うことができない。ただし、他の法律に別段の定めがある場合及び定型的かつ容易に行えるものとして総務省令で定める手続について、当該手続に関し相当の経験又は能力を有する者として総務省令で定める者が電磁的記録を作成する場合は、この限りでない。」","reason":"肢は、19条1項の本文のとおりである。ただし書の例外は「他の法律に別段の定めがある場合など」とまとめられている。肢は正しい。"},{"label":"エ","verdict":"×","purpose":"19条1項に違反した人は罰せられる（21条の2）。法人の仕事として違反がされたときに、行った人だけを罰しても、法人は痛まない。そこで23条の3は、法人にも罰金刑を科している。","law":"行政書士法21条の2「第十九条第一項の規定に違反したときは、その違反行為をした者は、一年以下の拘禁刑又は百万円以下の罰金に処する。」\n行政書士法23条の3「法人の代表者又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務に関し、第二十一条の二、第二十二条の四、第二十三条第二項又は前条の違反行為をしたときは、その行為者を罰するほか、その法人又は人に対して各本条の罰金刑を科する。」","reason":"23条の3は「その行為者を罰するほか、その法人又は人に対して各本条の罰金刑を科する」と定めている。肢は、法人に罰金刑が科されることはないとしているので誤りである。正しいものはアとウなので、正答は「二つ」になる。"}],"note":""},"30":{"items":[{"label":"ア","verdict":"○","purpose":"依頼者は、行政書士に個人や会社の事情を打ち明ける。秘密が守られなければ、安心して頼むことができない。この義務は、行政書士をやめた後も続く。","law":"行政書士法12条「行政書士は、正当な理由がなく、その業務上取り扱つた事項について知り得た秘密を漏らしてはならない。行政書士でなくなつた後も、また同様とする。」\n行政書士職務基本規則11条1項「行政書士は、正当な事由がなく、その職務上取り扱った事項について知り得た秘密を漏らしてはならない。行政書士でなくなった後も、また同様とする。」","reason":"肢は行政書士法12条のとおりなので正しい。職務基本規則11条1項も同じ内容を定めている。"},{"label":"イ","verdict":"○","purpose":"職務上請求書を使うと、戸籍や住民票の写しなどを本人の委任状なしに請求できる。それだけに、職務に必要な請求のほかに使えば、人の権利を侵害するおそれがある。","law":"行政書士職務基本規則10条2項「行政書士は、職務上請求書を、その職務上必要な請求に限り使用できるものとし、これ以外の請求や、身元調査等、人権侵害のおそれがある使用は、これを行ってはならない。」","reason":"肢は規則10条2項のとおりなので正しい。"},{"label":"ウ","verdict":"×","purpose":"依頼者は、頼んだ仕事がいまどうなっているかを知る必要がある。36条2項は、途中の報告と、終わったときの報告の両方を義務にしている。","law":"行政書士職務基本規則36条2項「行政書士は、依頼者に対し、事件の経過及び重要な事項を必要に応じて報告し、事件が終了したときは、その経過及び結果を遅滞なく報告しなければならない。」","reason":"条文は、事件の経過と重要な事項を「必要に応じて報告し」と定めている。受任している間の報告も義務である。肢は、終了したときに報告すれば足りるとしているので誤りである。"},{"label":"エ","verdict":"○","purpose":"行政書士が、依頼者や仲間や会を悪く言うと、行政書士全体の信用が傷つく。20条は、信義に反する行為を禁じている。","law":"行政書士職務基本規則20条「行政書士は、依頼者、他の行政書士、本会、所属する行政書士会（以下「単位会」という。）等を誹謗中傷する等、信義に反する行為をしてはならない。」\n行政書士職務基本規則前文「日本行政書士会連合会（以下「本会」という。）」","reason":"20条の「本会」は、日本行政書士会連合会のことである（規則の前文）。「所属する行政書士会」も並んでいる。肢は条文のとおりなので正しい。正しいものはア・イ・エなので、正答は「三つ」になる。"}],"note":""}};
var AREA=[['行政手続法',1,8],['行政不服審査法',9,16],['行政事件訴訟法',17,20],['要件事実・民事訴訟',21,27],['倫理',28,30]];
var N=Q.length,AIU=['ア','イ','ウ','エ','オ'],SYM=['','○','×'];
var st={a:[],f:[],e:[],m:[],left:7200,used:0,done:false};
for(var i=0;i<N;i++){st.a.push(0);st.f.push(false);st.e.push(false);st.m.push([0,0,0,0,0]);}
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.a&&sv.a.length===N)st=sv;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;}
var body=$('body'),timer=null,onlyNg=false;
function fmt(){var m=Math.floor(st.left/60),s=st.left%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function showTime(){var t=fmt();$('time').textContent=t;$('time').style.color=st.left<=600&&!st.done?'var(--red)':'';
  var cs=document.querySelectorAll('.clock');for(var i=0;i<cs.length;i++)cs[i].textContent='残り時間 '+t;}
function exItem(n,i){var x=EXP[n];return x&&x.items&&x.items[i]?x.items[i]:null;}
function exBox(it,myMark){
  var b=el('div','ex');
  var h=el('p');var v=el('span','v',it.label+'　'+it.verdict);h.appendChild(v);
  if(myMark&&(it.verdict==='○'||it.verdict==='×')){
    var ok=SYM[myMark]===it.verdict;var t=el('span','tag '+(ok?'right':'wrong'),'あなたの印 '+SYM[myMark]);h.appendChild(t);}
  b.appendChild(h);
  if(it.purpose)b.appendChild(el('p','',it.purpose));
  if(it.law)b.appendChild(el('p','law',it.law));
  if(it.reason)b.appendChild(el('p','',it.reason));
  return b;
}
function render(){
  body.textContent='';
  Q.forEach(function(d,q){
    var good=st.a[q]===ANS[q];
    if(st.done&&onlyNg&&good)return;
    var w=el('div','mq'+(st.done?(good?' ok':' ng'):''));w.id='q'+d.n;
    var s=el('p','stem');s.appendChild(el('b','','問題'+d.n+'　'));s.appendChild(document.createTextNode(d.s));
    if(st.done){s.appendChild(el('span','tag '+(good?'right':'wrong'),good?'正解':'不正解　正答 '+ANS[q]+'／あなた '+(st.a[q]||'－')));
      if(st.e[q])s.appendChild(el('span','tag fl','△'));}
    w.appendChild(s);
    if(d.p){var pb=el('div','pas');d.p.forEach(function(t){pb.appendChild(el('p','',t));});w.appendChild(pb);}
    function pick(v,text,cls,label){
      var b=el('button',cls);if(label)b.appendChild(el('span','k',label));b.appendChild(el('span','',text));
      if(st.a[q]===v)b.classList.add('sel');
      if(st.done){b.disabled=true;if(v===ANS[q])b.classList.add('right');else if(st.a[q]===v)b.classList.add('wrong');}
      else b.addEventListener('click',function(){st.a[q]=(st.a[q]===v)?0:v;save();render();});
      return b;
    }
    function marks(i){
      return [1,2].map(function(v){
        var b=el('button','m',SYM[v]);
        if(st.m[q][i]===v)b.classList.add(v===1?'mo':'mx');
        if(st.done)b.disabled=true;
        else b.addEventListener('click',function(){st.m[q][i]=(st.m[q][i]===v)?0:v;save();render();});
        return b;});
    }
    if(d.k){
      var c=0,x=0;
      d.k.forEach(function(t,i){
        var ln=el('div','line');ln.appendChild(el('p','sub',AIU[i]+'　'+t));
        marks(i).forEach(function(b){ln.appendChild(b);});w.appendChild(ln);
        if(st.m[q][i]===1)c++;if(st.m[q][i]===2)x++;
        if(st.done){var it=exItem(d.n,i);if(it)w.appendChild(exBox(it,st.m[q][i]));}
      });
      w.appendChild(el('div','note','○を付けた数 '+c+'　×を付けた数 '+x));
      var r=el('div','row');d.c.forEach(function(t,i){var b=pick(i+1,(i+1)+'　'+t,'');r.appendChild(b);});w.appendChild(r);
    }else{
      d.c.forEach(function(t,i){
        var ln=el('div','line'+(st.a[q]===i+1?' on':''));ln.appendChild(pick(i+1,String(i+1),'a'));ln.appendChild(el('p','t',t));
        marks(i).forEach(function(b){ln.appendChild(b);});w.appendChild(ln);
        if(st.done&&!d.p){var it=exItem(d.n,i);if(it)w.appendChild(exBox(it,st.m[q][i]));}
      });
      if(st.done&&d.p&&EXP[d.n]){EXP[d.n].items.forEach(function(it){w.appendChild(exBox(it,0));});}
    }
    if(st.done){
      if(EXP[d.n]&&EXP[d.n].note){var nb=el('div','pas');EXP[d.n].note.split('\n').forEach(function(t){nb.appendChild(el('p','',t));});w.appendChild(nb);}
    }else{
      var f=el('button','flag'+(st.f[q]?' fl':''),st.f[q]?'見直す印を外す':'あとで見直す');
      f.addEventListener('click',function(){st.f[q]=!st.f[q];if(st.f[q])st.e[q]=true;save();render();});
      w.appendChild(f);
    }
    body.appendChild(w);
    if(!st.done&&(q+1)%5===0&&q+1<N)body.appendChild(el('div','clock','残り時間 '+fmt()));
  });
  summary();
}
function lines(){
  var L=[];
  for(var i=0;i<N;i+=5){var e=Math.min(i+5,N),a=(Q[i].n<10?' ':'')+Q[i].n,b=(Q[e-1].n<10?' ':'')+Q[e-1].n;
    L.push('問'+a+'〜'+b+'： '+st.a.slice(i,e).map(function(x){return x||'－';}).join(' '));}
  return L;
}
function markLines(){
  var L=[];
  Q.forEach(function(d,q){var n=d.k?d.k.length:4,s='',any=false;
    for(var i=0;i<n;i++){s+=st.m[q][i]?SYM[st.m[q][i]]:'・';if(st.m[q][i])any=true;}
    if(any)L.push('問'+d.n+' '+s);});
  return L;
}
function summary(){
  var k=st.a.filter(function(a){return a>0;}).length;
  $('count').textContent=st.done?'採点済み':'解答済み '+k+' / '+N;
  $('sum').textContent=lines().join('\n');
  var fl=[];st.f.forEach(function(x,i){if(x)fl.push(Q[i].n);});
  $('flags').textContent=fl.length?('あとで見直す：問'+fl.join('、')):'';
  var jump=$('jump');jump.textContent='';
  if(!st.done)Q.forEach(function(d,i){
    if(st.a[i]&&!st.f[i])return;
    var b=el('button','flag','問'+d.n+'へ'+(st.a[i]?'（見直し）':'（未解答）'));
    b.addEventListener('click',function(){$('q'+d.n).scrollIntoView({behavior:'smooth',block:'start'});});
    jump.appendChild(b);});
  $('send').style.display=st.done?'none':'';
  $('lead').style.display=st.done?'none':'';
  $('err').textContent='';
}
function resultText(){
  var ok=0;Q.forEach(function(d,q){if(st.a[q]===ANS[q])ok++;});
  var ev=[];st.e.forEach(function(x,i){if(x)ev.push(Q[i].n);});
  var ml=markLines();
  return TITLE+'（単独版で採点済み・'+ok+'/'+N+'）\n'+lines().join('\n')+(ev.length?('\n△（あとで見直す）を付けた問：'+ev.join('、')):'')+(ml.length?('\n肢の印（・は無印）\n'+ml.join('\n')):'')+'\n所要時間：約'+Math.round(st.used/60)+'分'+(st.left<=0?'（時間切れ）':'');
}
function result(){
  var box=$('result');box.textContent='';
  if(!st.done)return;
  var ok=0;Q.forEach(function(d,q){if(st.a[q]===ANS[q])ok++;});
  var r=el('div','res');
  r.appendChild(el('div','big',ok+' / '+N+' 問正解'));
  r.appendChild(el('div','note','所要時間 約'+Math.round(st.used/60)+'分'));
  var tb=el('table');tb.style.margin='10px 0';
  AREA.forEach(function(a){var t=0,c=0;Q.forEach(function(d,q){if(d.n>=a[1]&&d.n<=a[2]){t++;if(st.a[q]===ANS[q])c++;}});
    if(!t)return;var tr=el('tr');tr.appendChild(el('td','',a[0]));tr.appendChild(el('td','',c+' / '+t));tb.appendChild(tr);});
  var kt=0,kc=0;Q.forEach(function(d,q){if(d.k){kt++;if(st.a[q]===ANS[q])kc++;}});
  if(kt){var tr=el('tr');tr.appendChild(el('td','','個数問題'));tr.appendChild(el('td','',kc+' / '+kt));tb.appendChild(tr);}
  r.appendChild(tb);
  var ng=[];Q.forEach(function(d,q){if(st.a[q]!==ANS[q])ng.push(d.n);});
  r.appendChild(el('div','',ng.length?('落とした問：'+ng.join('、')):'全問正解です。'));
  var row=el('div','row');
  var b1=el('button','',onlyNg?'全問を表示':'落とした問だけ表示');
  b1.addEventListener('click',function(){onlyNg=!onlyNg;result();render();});
  var b2=el('button','','結果をコピー');var msg=el('span','note');
  b2.addEventListener('click',function(){var t=resultText();
    function done(){msg.textContent='コピーしました。';}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback();});}else fallback();
    function fallback(){var ta=el('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){msg.textContent='コピーできませんでした。';}document.body.removeChild(ta);}
  });
  var b3=el('button','','最初から解き直す');
  b3.addEventListener('click',function(){if(!confirm('解答と印をすべて消して、最初から解き直しますか。'))return;
    try{localStorage.removeItem(KEY);}catch(e){}location.reload();});
  if(ng.length)row.appendChild(b1);row.appendChild(b2);row.appendChild(b3);row.appendChild(msg);
  r.appendChild(row);box.appendChild(r);
}
$('start').addEventListener('click',function(){
  if(st.done)return;
  if(timer){clearInterval(timer);timer=null;$('start').textContent='再開';return;}
  if(st.left<=0)return;
  $('start').textContent='一時停止';
  timer=setInterval(function(){
    if(st.left>0){st.left--;st.used++;showTime();if(st.used%5===0)save();}
    else{clearInterval(timer);timer=null;$('start').textContent='時間切れ';save();}
  },1000);
});
$('send').addEventListener('click',function(){
  var miss=[],fl=[];
  st.a.forEach(function(a,i){if(!a)miss.push(Q[i].n);});
  st.f.forEach(function(x,i){if(x)fl.push(Q[i].n);});
  if(st.left>0&&(miss.length||fl.length)){
    var m=[];if(miss.length)m.push('未解答：問'+miss.join('、'));if(fl.length)m.push('見直しの印が残っています：問'+fl.join('、'));
    $('err').textContent=m.join('　／　')+'　（解答し、印を外すと採点できます）';return;}
  if(!confirm('採点します。採点すると解答は変えられません。よろしいですか。'))return;
  if(timer){clearInterval(timer);timer=null;}
  st.done=true;save();$('start').style.display='none';
  result();render();window.scrollTo(0,0);
});
if(st.done)$('start').style.display='none';
else if(st.used>0)$('start').textContent='再開';
result();render();showTime();
})();
</script>
</body>
</html>
